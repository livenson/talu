apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Secrets mechanism (SOPS + age). Deliberately EMPTY of resources: encrypted Secret manifests must NOT
# sit in the kustomize resource graph, because `kustomize build | kubectl apply` (the dev/lab fast
# path and `make kbuild`) does NOT decrypt — it would emit/apply ciphertext. Encrypted Secrets are
# applied ONLY via:
#   • Flux: a Kustomization with `spec.decryption.provider: sops` (kustomize-controller decrypts), or
#   • by hand: `sops -d environments/<site>/secrets.yaml | kubectl apply -f -`.
# This component exists to hold the age Secret wiring docs + example stubs. See README.md.
resources: []
