# EXAMPLE (plaintext stub) — the shape of a SOPS-encrypted Secret. Copy to secrets.yaml in an
# environment overlay, fill real values, then `sops -e -i secrets.yaml` (the .sops.yaml rule encrypts
# only data/stringData). NEVER commit the filled-in plaintext — .gitignore blocks secrets.yaml and
# *.secret.yaml as a backstop.
#
# This is the OIDC client secret shared by Dex and Pomerium (today committed plaintext in
# ansible/group_vars as `pomerium_idp_client_secret` — see docs/operations/secrets.md § Migration).
apiVersion: v1
kind: Secret
metadata:
  name: pomerium-idp
  namespace: pomerium
type: Opaque
stringData:
  # generate: openssl rand -hex 32
  idp-client-secret: "REPLACE-ME-openssl-rand-hex-32"
