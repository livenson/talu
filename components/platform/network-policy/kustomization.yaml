apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Multi-tenant network isolation. Layer A (here) is the cluster-wide, non-overridable egress deny that
# closes KT-06. Layers B/C (per-tenant baseline egress allow-list + additive security groups) live in
# the tenant/cluster charts. See README + docs/development/production-readiness-plan.md § C.
resources:
  - tenant-egress-deny.yaml
