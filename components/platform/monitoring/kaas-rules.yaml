# KaaS alert rules — the hosted-control-plane layer's failure modes, ordered by blast radius.
# The shared kamaji-etcd is the widest: losing its quorum stalls EVERY tenant control plane at once
# (the PoC datastore compromise — per-tenant etcd removes that coupling).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: talu-kaas-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: talu
spec:
  groups:
    - name: talu-kaas
      rules:
        - alert: KamajiEtcdNoLeader
          expr: max(etcd_server_has_leader{namespace="kamaji-system"}) == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "kamaji-etcd has no leader — ALL tenant control planes are stalled"
        - alert: KamajiEtcdMemberDown
          # count members actually reporting rather than relying on the job label (job = Service name)
          expr: count(etcd_server_has_leader{namespace="kamaji-system"} == 1) < 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "kamaji-etcd is running degraded ({{ $value }}/3 members up)"
        - alert: KamajiEtcdSlowFsync
          expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{namespace="kamaji-system"}[5m])) > 0.1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "kamaji-etcd WAL fsync p99 > 100ms — datastore on RBD is struggling; move to local storage"
        - alert: KamajiReconcileErrors
          expr: sum(rate(controller_runtime_reconcile_errors_total{namespace="kamaji-system"}[5m])) > 0.1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "kamaji operator reconcile errors sustained — a TenantControlPlane is likely stuck (check kamaji logs)"
        - alert: TenantControlPlaneUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace=~"kaas-.*", deployment!~"kubevirt-csi-.*|.*cloud-provider.*"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "tenant control plane {{ $labels.namespace }}/{{ $labels.deployment }} has 0 available replicas"
        - alert: KaasCsiControllerDown
          expr: kube_deployment_status_replicas_available{namespace=~"kaas-.*", deployment=~"kubevirt-csi-controller.*"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "kubevirt-csi controller down in {{ $labels.namespace }} — tenant volume provision/attach stalled"
        - alert: KaasWorkerVMNotReady
          expr: |
            sum by (namespace) (kube_pod_status_ready{namespace=~"kaas-.*", condition="true", pod=~"virt-launcher-.*"})
            < sum by (namespace) (kube_pod_info{namespace=~"kaas-.*", pod=~"virt-launcher-.*"})
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }} has tenant worker VM(s) not Ready for 10m"
        # --- gap G6: alert on the CAPI/Kamaji inventory series ksm-crs.yaml already produces
        # (closes the test plan's KT-20 — a stuck tenant cluster now pages instead of only showing
        # amber on the dashboard). These fire only when a tenant exists, so they carry no cost on an
        # empty fleet; the series are the same ones the KaaS dashboard's inventory table reads.
        - alert: KaasClusterNotReady
          # CAPI Cluster settles in phase "Provisioned"; anything else sustained is a stuck cluster.
          expr: talu_kaas_cluster_phase_info{phase!="Provisioned"} == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "tenant cluster {{ $labels.namespace }}/{{ $labels.name }} stuck in phase {{ $labels.phase }} for 15m"
        - alert: KaasMachineDeploymentStalled
          # desired workers never became ready — bad containerdisk, expired bootstrap token (pre-MHC),
          # or exhausted infra capacity. MHC remediates node crashes; this catches a join that never lands.
          expr: |
            (talu_kaas_workers_ready < talu_kaas_workers_desired) or
            (talu_kaas_workers_desired > 0 unless talu_kaas_workers_ready)
          for: 20m
          labels: { severity: warning }
          annotations:
            summary: "tenant {{ $labels.cluster }} ({{ $labels.namespace }}) has workers not reaching Ready for 20m"
        # --- tenant-cluster DR: the kaas-etcd-snapshot CronJob (components/tenancy/kaas-backup/).
        # Observed via kube-state-metrics on the CronJob/Job itself — no Pushgateway. RPO target 15m,
        # so a last-success older than 1h means backups have silently stopped (losing a tenant's etcd
        # then loses the cluster with no recovery point).
        - alert: KaasEtcdSnapshotStale
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="kamaji-system", cronjob="kaas-etcd-snapshot"}) > 3600
          for: 15m
          labels: { severity: critical }
          annotations:
            summary: "kaas-etcd-snapshot has not succeeded in over 1h — tenant etcd backups are stale"
        - alert: KaasEtcdSnapshotFailing
          expr: kube_job_status_failed{namespace="kamaji-system", job_name=~"kaas-etcd-snapshot.*"} > 0
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "kaas-etcd-snapshot Job {{ $labels.job_name }} is failing — a tenant etcd snapshot did not complete"
