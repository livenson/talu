# Control-plane density — API-server latency/rate/errors/inflight (the churn knee shows here). NOTE:
# on THIS Talos cluster etcd + scheduler + controller-manager metrics are NOT scraped (no
# ServiceMonitors/targets — Talos binds those to localhost / needs cert-based etcd :2381 scraping), so
# the etcd-fsync knee is not directly observable yet. The etcd/scheduler panels below are wired for
# when that scrape is enabled; until then they read empty. FINDING logged in the perf/test notes.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: talu-control-plane
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: talu
spec:
  instanceSelector:
    matchLabels:
      talu.io/perses: operator
  config:
    display:
      name: Talu — Control Plane (density)
    duration: 1h
    panels:
      apilat:
        kind: Panel
        spec:
          display: { name: "API request p99 latency by verb (s)" }
          plugin: { kind: TimeSeriesChart, spec: {} }
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin: { kind: PrometheusTimeSeriesQuery, spec: { query: "histogram_quantile(0.99, sum by (le, verb) (rate(apiserver_request_duration_seconds_bucket{verb=~\"POST|PUT|DELETE|GET|LIST\"}[5m])))" } }
      apirate:
        kind: Panel
        spec:
          display: { name: "API request rate by verb (/s)" }
          plugin: { kind: TimeSeriesChart, spec: {} }
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin: { kind: PrometheusTimeSeriesQuery, spec: { query: "sum by (verb) (rate(apiserver_request_total[2m]))" } }
      apierrors:
        kind: Panel
        spec:
          display: { name: "API errors /s (5xx + 429 throttling)" }
          plugin: { kind: TimeSeriesChart, spec: {} }
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin: { kind: PrometheusTimeSeriesQuery, spec: { query: "sum by (code) (rate(apiserver_request_total{code=~\"5..|429\"}[2m]))" } }
      inflight:
        kind: Panel
        spec:
          display: { name: "API in-flight requests (saturation)" }
          plugin: { kind: TimeSeriesChart, spec: {} }
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin: { kind: PrometheusTimeSeriesQuery, spec: { query: "sum by (request_kind) (apiserver_current_inflight_requests)" } }
      etcdfsync:
        kind: Panel
        spec:
          display: { name: "etcd WAL fsync p99 (s) — NEEDS Talos etcd scrape (empty until enabled)" }
          plugin: { kind: TimeSeriesChart, spec: {} }
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin: { kind: PrometheusTimeSeriesQuery, spec: { query: "histogram_quantile(0.99, sum by (le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])))" } }
      schedlat:
        kind: Panel
        spec:
          display: { name: "Scheduler e2e p99 (s) — NEEDS scheduler scrape (empty until enabled)" }
          plugin: { kind: TimeSeriesChart, spec: {} }
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin: { kind: PrometheusTimeSeriesQuery, spec: { query: "histogram_quantile(0.99, sum by (le) (rate(scheduler_e2e_scheduling_duration_seconds_bucket[5m])))" } }
    layouts:
      - kind: Grid
        spec:
          display: { title: "API server (RED)" }
          items:
            - { x: 0,  y: 0, width: 12, height: 8, content: { $ref: "#/spec/panels/apilat" } }
            - { x: 12, y: 0, width: 12, height: 8, content: { $ref: "#/spec/panels/apirate" } }
            - { x: 0,  y: 8, width: 12, height: 8, content: { $ref: "#/spec/panels/apierrors" } }
            - { x: 12, y: 8, width: 12, height: 8, content: { $ref: "#/spec/panels/inflight" } }
      - kind: Grid
        spec:
          display: { title: "etcd + scheduler (pending Talos CP scrape)" }
          items:
            - { x: 0,  y: 0, width: 12, height: 8, content: { $ref: "#/spec/panels/etcdfsync" } }
            - { x: 12, y: 0, width: 12, height: 8, content: { $ref: "#/spec/panels/schedlat" } }
