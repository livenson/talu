# talu-cluster — a managed tenant Kubernetes cluster as a values file.
# Required: name, projectUuid, debugPublicKey. Everything else has a validated default.

# Cluster identity (name is the CAPI cluster name; projectUuid is the manager join key).
name: ""
projectUuid: ""
# Empty => "kaas-<name>", a DEDICATED namespace per tenant. This matters once wiring.enabled renders
# CSI/CCM (their SAs/Roles/ConfigMaps would collide if two tenants shared one namespace) and makes
# per-tenant metering/isolation key on namespace. Set explicitly (e.g. kaas-capi) only for the legacy
# single-tenant-per-namespace layout.
namespace: ""

# Tenant Kubernetes version — tracks the newest quay.io/capk/ubuntu-2404-container-disk tag, NOT the
# management version (no v1.35 capk image yet; the skew against Kamaji edge is handled in-template).
kubernetesVersion: v1.34.1

# Datastore. Empty => "<name>-local", a DEDICATED kamaji-etcd on local-path (~50x lower fsync than
# the shared RBD default). That DataStore must exist before this cluster reconciles (kamaji-etcd helm
# release) — see README. Set to "default" to use the shared datastore for throwaway clusters.
dataStore: ""

# Distinct from the management pod/service CIDRs and from other tenants'.
podCidr: 10.243.0.0/16
serviceCidr: 10.95.0.0/16

controlPlane:
  replicas: 2          # spread across nodes → survives a management-node loss

workers:
  replicas: 2          # ignored when autoscaling.enabled (the autoscaler owns the count)
  cores: 4
  memory: 8Gi
  # Node autoscaling via a per-tenant cluster-autoscaler (clusterapi provider). When enabled the
  # MachineDeployment's spec.replicas is OMITTED (the autoscaler owns it) and min/max annotations are
  # rendered; scale-from-zero capacity annotations go on the KubevirtMachineTemplate. Default off.
  # GitOps caveat: the deploying HelmRelease must NOT reconcile spec.replicas back —
  #   spec.driftDetection.ignore: [{ paths: ["/spec/replicas"], target: { kind: MachineDeployment } }]
  # or the autoscaler and Flux fight over the count. In-tenant pod autoscaling (HPA) is the tenant's
  # own concern and needs nothing here.
  autoscaling:
    enabled: false
    min: 1
    max: 3
    # Match the tenant Kubernetes minor (cluster-autoscaler tracks k8s).
    image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.34.0
    maxNodeProvisionTime: 20m   # ≥ MHC nodeStartupTimeout (15m); a fresh worker pulls Cilium (~5 min)

healthCheck:
  unreadyTimeout: 5m   # node NotReady this long → MachineHealthCheck replaces the Machine

# Keep in lockstep with the management Cilium pin.
ciliumVersion: "1.19.6"

# Operator break-glass SSH key baked into worker nodes. REQUIRED: CAPK skips its own keypair when
# Kamaji manages the cluster, so this is the only way into a node guest.
debugPublicKey: ""

# ── Cross-cluster WIRING (the graduation of phys_kaas_tenant into the chart) ─────────────────────
# When enabled, the chart renders the infra-side wiring that previously needed a post-provision
# imperative step — by mounting the Kamaji-created "<name>-admin-kubeconfig" Secret DIRECTLY (the
# pods sit Pending until Kamaji publishes it, then start; pure eventual consistency, no imperative
# copy). Default off so the declarative-only behaviour is unchanged until you opt in.
# NOT YET LAB-EXERCISED as a chart — the validated path remains ansible/roles/phys_kaas_tenant.
wiring:
  enabled: false
  csi:
    # Infra StorageClass tenant PVCs land on (kubevirt-csi maps tenant PVC -> infra PVC). The infra
    # CDI StorageProfile for this class must default Filesystem/RWO (Block-mode CDI broken on Talos).
    infraStorageClass: ceph-block
    image: quay.io/kubevirt/kubevirt-csi-driver:latest
  ccm:
    enabled: true
    image: quay.io/kubevirt/kubevirt-cloud-controller-manager:main
  # In-tenant manifests applied via ClusterResourceSet (CAPI writes them with its held kubeconfig):
  # the CSI node plugin/driver/StorageClass and the Pomerium impersonation RBAC + first admin binding.
  inTenant:
    enabled: true
    # Gets cluster-admin in the tenant via the Pomerium impersonation route (the kubectl access model).
    adminUser: ""

# ── In-tenant DR (the PVC-data half; the etcd half is the mgmt-side kaas-backup CronJob) ─────────
# Velero + node-agent installed INSIDE the tenant (on its worker VMs, where the kubevirt-csi volumes
# are mounted) via a HelmChartProxy, writing to Garage. Default off. Requires: Garage's S3 endpoint
# reachable from the tenant (the garage-lb LoadBalancer — see components/platform/backup/garage-lb.yaml),
# a per-tenant bucket, and the creds Secret provisioned in the tenant (SOPS/CRS — NOT rendered here).
backup:
  inTenant:
    enabled: false
    s3Url: ""                       # e.g. http://<garage-lb-ip>:3900 (required when enabled)
    bucket: ""                      # per-tenant bucket, e.g. kaas-velero-<name> (required when enabled)
    existingSecret: velero-garage   # Secret in the tenant's velero ns, key `cloud` (AWS creds file)
    veleroChartVersion: "8.1.0"     # vmware-tanzu/velero chart
