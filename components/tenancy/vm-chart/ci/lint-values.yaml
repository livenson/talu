# Minimal VALID values for `helm lint` / `helm template` in CI. Not used at runtime.
projectUuid: "aaaaaaaa-1111-2222-3333-444444444444"
slug: citest
name: app1
principal: alice
size: small
allowedUsers: [alice@talu.local]
securityGroups: [web]
sshUserCaPubKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILINTonlyPlaceholderKeyNotARealCA citest"
guestSecrets: |
  DB_PASSWORD=citest
logging:
  agent: true

# Render the ssh Ingress in CI. Left off, the Ingress template is never exercised — which is how it
# shipped with an HTTP-shaped `path: / , pathType: Prefix` that Pomerium rejects for an ssh_upstream
# route (adr-pomerium-ingress.md §7.2). Off in values.yaml is the runtime default; CI must still
# render the path.
ingress:
  enabled: true
