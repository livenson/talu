{{- include "talu-vm.validate" . -}}
{{- $root := . -}}
{{- $ns := .Values.slug -}}
{{- $name := .Values.name -}}
{{- $principal := .Values.principal | default "talu" -}}
{{- /* Nil-safe: an overlay may set `restore:` with no body. Validation (talu-vm.validate)
       has already run by the time these are used. */ -}}
{{- $restore := .Values.restore | default dict -}}
{{- $restoreRoot := $restore.root | default dict -}}
{{- $retrustCfg := $restore.retrust | default dict -}}
---
# Cloud-init lives in a Secret (guest secrets stay out of the VM manifest; the manager writes it).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-userdata
  namespace: {{ $ns }}
  labels:
    talu.io/vm: {{ $name | quote }}
    {{- include "talu-vm.labels" $root | nindent 4 }}
type: Opaque
stringData:
  userdata: |
    #cloud-config
    users:
      - name: {{ $principal }}
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        lock_passwd: true
    {{- if $root.Values.caTrust.package }}
    # SSH User CA trust via the talu-ca-trust PACKAGE (rotatable — see dev/lab/ca-rotate.sh). dpkg owns
    # /etc/ssh/talu_ca.pub, so a CA rotation is just a package upgrade (unattended-upgrades pulls it),
    # never a re-provision. The guest fetches it from the tenant's configured apt repo.
    apt:
      sources:
        talu-ca-trust:
          source: {{ required "caTrust.aptRepoLine is required when caTrust.package=true" $root.Values.caTrust.aptRepoLine | quote }}
    package_update: true
    packages:
      - talu-ca-trust
      - unattended-upgrades
    {{- end }}
    write_files:
    {{- if and (not $root.Values.caTrust.package) (not $root.Values.caTrust.baked) }}
      # Fallback (default): hand-write the trust file from the current CA pubkey. Simple + repo-free, but
      # a CA rotation then needs the VM recreated. Rotatable options: caTrust.package=true (mutable guests,
      # apt), or caTrust.baked=true (bootc golden image already carries the talu-ca-trust rpm — write
      # NOTHING here, or cloud-init's file becomes an /etc override that blocks image updates, lab-notes #35).
      - path: /etc/ssh/talu_ca.pub
        content: {{ required "sshUserCaPubKey is required unless caTrust.package or caTrust.baked" $root.Values.sshUserCaPubKey | trim | quote }}
        permissions: "0644"
      - path: /etc/ssh/sshd_config.d/60-talu-ca.conf
        content: |
          TrustedUserCAKeys /etc/ssh/talu_ca.pub
          PasswordAuthentication no
    {{- end }}
      # VM logs Tier 1 (default): stream the journal to the serial console. KubeVirt captures ttyS0 into
      # the virt-launcher guest-console-log container, which Alloy ships to Loki — labelled
      # namespace=<tenant>, vm=<name> by the platform (not the guest). Nothing to spoof.
      # We use a tiny `journalctl -f > /dev/console` SERVICE rather than journald's own ForwardToConsole:
      # the latter needs journald (re)started with the console attached, which is racy under cloud-init
      # (getty grabs /dev/ttyS0 first, and a late `systemctl restart systemd-journald` silently drops
      # forwarding). Writing to /dev/console (the kernel console multiplexer → ttyS0 via `console=ttyS0`)
      # from a dedicated service is deterministic and getty-independent. (See lab-notes #33.)
      - path: /etc/systemd/system/talu-console-logs.service
        permissions: "0644"
        content: |
          [Unit]
          Description=Talu: stream the journal to the serial console (KubeVirt guest-console-log capture)
          After=systemd-journald.service
          [Service]
          ExecStart=/bin/sh -c "exec journalctl -b -f -o short-iso --no-hostname -p {{ $root.Values.logging.consoleLevel | default "info" }} > /dev/console 2>&1"
          Restart=always
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
    {{- if $root.Values.guestSecrets }}
      - path: /etc/talu/app.env
        permissions: "0600"
        content: |
          {{- $root.Values.guestSecrets | nindent 10 }}
    {{- end }}
    {{- if $root.Values.logging.agent }}
      # VM logs Tier 2 (opt-in): the in-guest agent (Fluent Bit, baked into the golden image) tails
      # journald + any extra paths and PUSHES to this tenant's ingest gateway — never to Loki directly.
      # The gateway (not the guest) stamps the tenant namespace, so nothing here is trust-bearing.
      - path: /etc/fluent-bit/talu.conf
        permissions: "0644"
        content: |
          [SERVICE]
              flush        5
              daemon       off
              log_level    info
              parsers_file parsers.conf
          [INPUT]
              name         systemd
              tag          host.journal
              read_from_tail on
          {{- range $i, $p := ($root.Values.logging.paths | default list) }}
          [INPUT]
              name         tail
              tag          host.file
              path         {{ $p }}
          {{- end }}
          [OUTPUT]
              name         loki
              match        *
              host         logs-gateway.{{ $ns }}.svc.cluster.local
              port         3100
              # vm scopes WITHIN this tenant only; the gateway overwrites namespace regardless.
              labels       vm={{ $name }}, job=guest-agent
    {{- end }}
    runcmd:
      - systemctl restart ssh
      - systemctl daemon-reload
      - systemctl enable --now talu-console-logs.service
    {{- if $root.Values.caTrust.package }}
      # Auto-update the CA-trust package (reboot-less rotation): allow unattended-upgrades from this repo.
      # `origin=` matches the Release `Origin:` field the apt-reindex.sh writes (default talu).
      - printf 'Unattended-Upgrade::Origins-Pattern { "origin=%s"; };\nAPT::Periodic::Update-Package-Lists "1";\nAPT::Periodic::Unattended-Upgrade "1";\n' "{{ $root.Values.caTrust.aptOrigin | default "talu" }}" > /etc/apt/apt.conf.d/51talu-ca
      - systemctl enable --now unattended-upgrades || true
    {{- end }}
    {{- if $root.Values.logging.agent }}
      # Enable the baked-in agent. `|| true` so a base image without Fluent Bit still boots (Tier 1
      # keeps working); the golden image (images/*/Containerfile) bakes fluent-bit for full Tier 2.
      - systemctl enable --now fluent-bit --no-block || true
    {{- end }}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    talu.io/vm: {{ $name | quote }}
    {{- include "talu-vm.labels" $root | nindent 4 }}
spec:
  {{- $retrust := and (eq $root.Values.source "import") $retrustCfg.enabled }}
  {{- if $retrust }}
  # Held OFF while the offline re-trust Job rewrites the imported disk — booting first would let the
  # guest come up with the wrong SSH CA (and would race virt-customize for the image). Git flips this
  # back: set restore.retrust.enabled=false once the Job has Completed. See retrust-job.yaml.
  runStrategy: Halted
  {{- else }}
  runStrategy: Always
  {{- end }}
  {{- if $root.Values.size }}
  # Named size (preferred). KubeVirt REJECTS a VM that also sets domain.cpu/domain.resources, which is
  # the point: the size is enforced, not advisory. Snapshotted into a ControllerRevision at creation,
  # so redefining the size later does not resize this VM. See components/tenancy/sizes/.
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: talu-{{ $root.Values.size }}
  {{- end }}
  {{- $dataDisks := $root.Values.dataDisks | default list }}
  {{- if or (eq $root.Values.source "dataSource") (eq $root.Values.source "import") $dataDisks }}
  # Every DataVolume uses `storage:` rather than `pvc:` so CDI's StorageProfile picks the access mode
  # and volume mode — the sites force Filesystem/RWO because block-mode CDI is broken on Talos.
  dataVolumeTemplates:
    {{- if eq $root.Values.source "dataSource" }}
    # Persistent root disk cloned from the golden-image DataSource (CDI). New VMs get the latest patched
    # image automatically (the DataImportCron rolls the DataSource); the disk persists → bootc self-update.
    - metadata:
        name: {{ $name }}-root
        labels:
          {{- include "talu-vm.labels" $root | nindent 10 }}
      spec:
        sourceRef:
          kind: DataSource
          name: {{ $root.Values.dataSource | quote }}
          namespace: {{ $root.Values.dataSourceNamespace | quote }}
        storage:
          resources: { requests: { storage: {{ $root.Values.rootDiskSize }} } }
    {{- else if eq $root.Values.source "import" }}
    # DR restore: the root disk is imported from a package artifact, NOT cloned from the site catalog
    # (docs/architecture/drim-target.md §4.1). This bypasses the golden image entirely — so it also
    # bypasses the cosign policy, which matches registry sources only, and the guest carries whatever
    # SSH CA trust it had at its origin (§4.3, gated on restore.acknowledgeGuestTrust).
    - metadata:
        name: {{ $name }}-root
        labels:
          {{- include "talu-vm.labels" $root | nindent 10 }}
      spec:
        source:
          {{- include "talu-vm.dvSource" $restoreRoot | trim | nindent 10 }}
        storage:
          resources: { requests: { storage: {{ $root.Values.rootDiskSize }} } }
    {{- end }}
    {{- range $d := $dataDisks }}
    - metadata:
        name: {{ $name }}-{{ $d.name }}
        labels:
          {{- include "talu-vm.labels" $root | nindent 10 }}
      spec:
        source:
          {{- include "talu-vm.dvSource" $d | trim | nindent 10 }}
        storage:
          resources: { requests: { storage: {{ $d.size }} } }
    {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        kubevirt.io/vm: {{ $name }}
        talu.io/project-uuid: {{ $root.Values.projectUuid | quote }}
        {{- /* Security-group membership is declared BY THE VM and selected by the tenant's
               CiliumNetworkPolicies (docs/architecture/adr-api-layer.md §10.1). The tenant chart no
               longer needs to know VM names. */}}
        {{- range $root.Values.securityGroups }}
        talu.io/sg.{{ . }}: "true"
        {{- end }}
    spec:
      domain:
        devices:
          disks:
            - { name: rootdisk, disk: { bus: virtio } }
            - { name: cloudinit, disk: { bus: virtio } }
            {{- if $dataDisks }}
            # `serial` surfaces in the guest as /dev/disk/by-id/virtio-<name>, so a restored guest can
            # mount each data disk by name instead of guessing device order (which is not stable).
            {{- end }}
            {{- range $d := $dataDisks }}
            - { name: {{ $d.name }}, disk: { bus: virtio }, serial: {{ $d.name | quote }} }
            {{- end }}
          interfaces: [{ name: default, masquerade: {} }]
        {{- if $root.Values.memory }}
        # Legacy sizing. Deprecated in favour of `size:` — it cannot express vCPU, so KubeVirt defaults
        # the guest to 1 (sockets*cores*threads), and nothing stops a consumer asking for any value.
        resources: { requests: { memory: {{ $root.Values.memory }} } }
        {{- end }}
      networks: [{ name: default, pod: {} }]
      volumes:
        {{- if or (eq $root.Values.source "dataSource") (eq $root.Values.source "import") }}
        - name: rootdisk
          dataVolume: { name: {{ $name }}-root }
        {{- else }}
        - name: rootdisk
          containerDisk: { image: {{ $root.Values.image }} }
        {{- end }}
        # Attached even for an imported disk: harmless if the guest has no cloud-init, and it is what
        # a guest whose cached instance-id differs picks up on first boot. Do NOT rely on it to carry
        # the SSH CA trust into an imported guest — see README.md § Importing a disk.
        - name: cloudinit
          cloudInitNoCloud:
            secretRef: { name: {{ $name }}-userdata }
        {{- range $d := $dataDisks }}
        - name: {{ $d.name }}
          dataVolume: { name: {{ $name }}-{{ $d.name }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-ssh
  namespace: {{ $ns }}
  labels:
    talu.io/ssh-expose: "true"
    talu.io/vm: {{ $name | quote }}
    {{- include "talu-vm.labels" $root | nindent 4 }}
  annotations:
    # per-tenant SSH allow-list read by the Pomerium route renderer (annotation: emails have '@').
    # Still passed in per VM — moving route-sync to read it from the Tenant instead is deferred, see
    # docs/architecture/adr-api-layer.md §10.1.
    talu.io/allowed-users: {{ join "," $root.Values.allowedUsers | quote }}
spec:
  selector: { kubevirt.io/vm: {{ $name }} }
  ports: [{ name: ssh, port: 22, targetPort: 22 }]
---
# Pin the VM's :22 so ONLY Pomerium can reach it (defense in depth behind the SSH gate).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-ssh-pin
  namespace: {{ $ns }}
  labels:
    talu.io/vm: {{ $name | quote }}
    {{- include "talu-vm.labels" $root | nindent 4 }}
spec:
  endpointSelector: { matchLabels: { kubevirt.io/vm: {{ $name }} } }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: pomerium }
      toPorts: [{ ports: [{ port: "22", protocol: TCP }] }]
