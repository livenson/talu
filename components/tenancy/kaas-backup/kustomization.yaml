apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# KaaS tenant-cluster DR. The etcd-snapshot CronJob is the mgmt-side half (a consistent snapshot of
# every per-tenant kamaji-etcd → Garage). The workload/PVC-data half is in-tenant Velero, shipped via
# the talu-cluster chart's velero HelmChartProxy — see docs/development/production-readiness-plan.md.
resources:
  - etcd-snapshot.yaml
