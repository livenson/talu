# Talu native tenant bundle — the namespace half of the tenant API. Since the split
# (docs/architecture/adr-api-layer.md §10.1) this chart owns the namespace, quota, RBAC, network
# baseline, security-group policies, dashboards and log gateway; each VM is a SEPARATE talu-vm
# release. Every rendered object carries talu.io/project-uuid — the join key any external
# orchestrator reconciles on.
#
# SSH access is Pomerium Native SSH: each VM's Service (rendered by talu-vm) is labelled
# talu.io/ssh-expose and annotated talu.io/allowed-users, and the Pomerium config renderer turns that
# into an ssh://<vm> route scoped to the tenant's members (see components/platform/access/).

projectUuid: ""            # REQUIRED, e.g. 3f2a91bc-...  -> talu.io/project-uuid on every object
slug: ""                   # REQUIRED, the tenant namespace name; frozen at creation (survives renames)

# Tenant members — emails that may SSH into this tenant's VMs (Pomerium per-route policy) and,
# where apiserver OIDC is wired, hold the scoped RBAC role in this namespace.
allowedUsers: []           # e.g. [alice@talu.local]

# Per-tenant guardrails. resourceQuota is a DEFAULT (always rendered) so every tenant has a metering
# envelope — `kube_resourcequota` then yields per-namespace utilisation for dashboards/accounting.
# Override the numbers per tenant, or set `resourceQuota: {}` to opt out entirely.
resourceQuota:
  requests.cpu: "8"
  requests.memory: 16Gi
  requests.storage: 200Gi
  persistentvolumeclaims: "10"
  count/virtualmachines.kubevirt.io: "10"

# Per-tenant dashboards: a namespace-scoped Perses + prom-label-proxy stack, reachable only via
# Pomerium. Off by default (each enabled tenant adds ~2 small pods). Data isolation is enforced by
# prom-label-proxy hardcoding namespace=<slug>, so the tenant can only ever see their own metrics.
dashboards:
  enabled: false
  persesImage: docker.io/persesdev/perses:v0.53.0
  proxyImage: quay.io/prometheuscommunity/prom-label-proxy:v0.11.1
  prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring.svc:9090

# VM internal logs, tenant side. Tier 1 (serial console → guest-console-log → Alloy → Loki) is ALWAYS
# on and needs nothing here. Tier 2 (opt-in) renders this tenant's Cilium-pinned ingest gateway, which
# hard-stamps the namespace on every line the guests push (the guest is never trusted with the tenant
# label). The guest-side half of Tier 2 lives in talu-vm (logging.agent/paths/consoleLevel).
logging:
  agent: false             # Tier 2: render the per-tenant ingest gateway
  lokiUrl: http://loki.logging.svc.cluster.local:3100   # gateway → Loki (VMs never reach this directly)
  gatewayImage: docker.io/grafana/alloy:v1.17.1         # the per-tenant ingest gateway (receive+stamp)

internalIpPool: ""         # tier-1 CiliumLoadBalancerIPPool CIDR for this tenant (empty = feature off)

# Layer B network baseline (opt-in hardening). When enabled, every VM in this tenant defaults to
# DENY egress and ingress except: cluster DNS, its own namespace, and the mandatory host/health path.
# Grant everything else (internet, specific peers) via securityGroups below — they're additive allows.
# Cross-tenant isolation (KT-07) and tenant->mgmt-API isolation then fall out for free (the latter is
# also enforced cluster-wide by Layer A, components/platform/network-policy/). Default off because a
# general VM usually wants open egress; enable per security-sensitive tenant after a Hubble audit.
networkBaseline:
  enabled: false

# Security groups: cloud-style ingress/egress allow-rules -> CiliumNetworkPolicy.
# MEMBERSHIP IS DECLARED BY THE VM, not listed here: a talu-vm release sets `securityGroups: [web]`,
# which renders a talu.io/sg.web label the policy below selects on. Set `allVMs: true` to apply a
# group to every VM in the tenant regardless of what the VMs declare.
securityGroups: {}
#   web:
#     ingress:
#       - ports: [{ port: 80, protocol: TCP }, { port: 443, protocol: TCP }]
#         fromCIDR: ["0.0.0.0/0"]
#   egress-all:
#     allVMs: true
#     egress:
#       - toCIDR: ["0.0.0.0/0"]

# Scoped RBAC: bind allowedUsers to a namespace-admin Role (needs apiserver OIDC to actually log in).
rbac:
  enabled: true

# Pomerium route as an Ingress object instead of a line in the shared config blob that the route-sync
# CronJob renders (docs/architecture/adr-pomerium-ingress.md). OFF until the Ingress Controller
# supersedes the current Pomerium deployment; with it off nothing changes.
#
# `domain` has no default on purpose: route-sync read it from the talu-platform ConfigMap, but an
# Ingress host must be concrete at render time, so the site supplies it (tenant-defaults.yaml).
ingress:
  enabled: false
  className: pomerium
  domain: ""
