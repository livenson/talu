{{- $root := . -}}
{{- $ns := .Values.slug -}}
{{- range $sgName, $sg := .Values.securityGroups }}
{{- $sg = $sg | default dict }}
---
# Security group "{{ $sgName }}" — cloud-style allow-rules on the tenant's VMs.
# Membership is declared BY THE VM (talu-vm renders a talu.io/sg.<name> label), not listed here by
# name: since the split (docs/architecture/adr-api-layer.md §10.1) a VM is its own object and this
# chart cannot know their names. `allVMs: true` keeps the old "every VM in the tenant" behaviour.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sg-{{ $sgName }}
  namespace: {{ $ns }}
  labels:
    talu.io/security-group: {{ $sgName | quote }}
    {{- include "talu-tenant.labels" $root | nindent 4 }}
spec:
  endpointSelector:
    {{- if $sg.allVMs }}
    matchExpressions:
      - { key: kubevirt.io/vm, operator: Exists }
    {{- else }}
    matchLabels:
      talu.io/sg.{{ $sgName }}: "true"
    {{- end }}
  {{- if $sg.ingress }}
  ingress:
    {{- range $sg.ingress }}
    -
      {{- if .fromCIDR }}
      fromCIDR:
        {{- toYaml .fromCIDR | nindent 8 }}
      {{- end }}
      {{- if .fromEndpoints }}
      fromEndpoints:
        {{- toYaml .fromEndpoints | nindent 8 }}
      {{- end }}
      {{- if .ports }}
      toPorts:
        - ports:
          {{- range .ports }}
            - { port: {{ .port | quote }}, protocol: {{ .protocol | default "TCP" }} }
          {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if $sg.egress }}
  egress:
    {{- range $sg.egress }}
    -
      {{- if .toCIDR }}
      toCIDR:
        {{- toYaml .toCIDR | nindent 8 }}
      {{- end }}
      {{- if .toEndpoints }}
      toEndpoints:
        {{- toYaml .toEndpoints | nindent 8 }}
      {{- end }}
      {{- if .ports }}
      toPorts:
        - ports:
          {{- range .ports }}
            - { port: {{ .port | quote }}, protocol: {{ .protocol | default "TCP" }} }
          {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
