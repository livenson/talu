# A tenant, as the two objects an orchestrator applies directly to the K8s API. Flux's helm-controller
# renders them; deleting them GCs what they own.
#
# Since the chart split (docs/architecture/adr-api-layer.md §10.1) a tenant is:
#   1. ONE talu-tenant release  — the namespace half: quota, RBAC, network baseline, security-group
#      policies, dashboards, log gateway;
#   2. ONE talu-vm release PER VM — so "may add a VM" is grantable without granting "may change the
#      tenant's quota or members", and each VM gets its own status.
#
# spec.values carries CONSUMER-owned fields only (x-talu-owner: consumer in each chart's schema). The
# operator half is merged ahead of it from ConfigMaps the site maintains:
#   talu-tenant-defaults / talu-vm-defaults — from environments/<site>/{tenant,vm}-defaults.yaml
#   pomerium-user-ca                        — the SSH User CA, injected live so a rotation needs no edit
# Merge order (later wins): chart values.yaml < <chart>-defaults < pomerium-user-ca < spec.values.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: acme
  namespace: tenants
spec:
  interval: 5m
  chartRef: { kind: OCIRepository, name: talu-tenant, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: talu-tenant-defaults
      valuesKey: values.yaml
      optional: true
  values:
    projectUuid: "aaaaaaaa-1111-2222-3333-444444444444"
    slug: acme
    allowedUsers: [alice@talu.local]
    resourceQuota: { requests.memory: 8Gi, requests.cpu: "4" }
    securityGroups:
      web:
        # No VM list: a VM joins by declaring `securityGroups: [web]`, which renders the
        # talu.io/sg.web label this policy selects on. Use `allVMs: true` for tenant-wide groups.
        ingress:
          - ports: [{ port: 80, protocol: TCP }, { port: 443, protocol: TCP }]
            fromCIDR: ["0.0.0.0/0"]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: acme-app1
  namespace: tenants
spec:
  interval: 5m
  chartRef: { kind: OCIRepository, name: talu-vm, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: talu-vm-defaults
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: pomerium-user-ca
      valuesKey: user_ca.pub
      targetPath: sshUserCaPubKey
  values:
    # projectUuid / slug / allowedUsers repeat the tenant's identity: this VM belongs to it. The
    # tenancy role injects them from tenant.yaml; a direct API client supplies them itself.
    projectUuid: "aaaaaaaa-1111-2222-3333-444444444444"
    slug: acme
    allowedUsers: [alice@talu.local]
    name: app1
    principal: alice
    size: small              # -> VirtualMachineClusterInstancetype talu-small (components/tenancy/sizes/)
    securityGroups: [web]
    guestSecrets: |
      DB_PASSWORD=acme-db-secret
