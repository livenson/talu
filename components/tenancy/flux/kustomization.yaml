apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The tenant-as-HelmRelease control plane: an in-cluster OCI registry holding the talu-tenant chart and
# the Flux OCIRepository source that pulls it.
#
# route-sync.yaml is deliberately NOT in this list (adr-pomerium-ingress.md §6 step 6). On the physical
# lab routes are Ingress objects served by the Pomerium Ingress Controller, and re-applying this
# component must not resurrect the CronJob — `phys_tenancy` runs `apply -k` over it on every run.
# The VM lab has NOT migrated and still needs route-sync, so the `tenancy` role applies that one file
# explicitly. Delete the file once the VM lab moves to Ingress routing too.
#
# NOT here: Flux's own controllers (source-controller + helm-controller) — the ansible `tenancy` role
# installs those via `flux install` (upstream manifests). `chart-publish-job.yaml` is applied on-demand
# by the role (Jobs are immutable, so re-applying via kustomize would fail). `helmrelease.example.yaml`
# is a sample tenant, not applied. Multi-namespace (flux-system + pomerium) — each resource self-labels.
resources:
  - oci-registry.yaml
  - ocirepository.yaml
