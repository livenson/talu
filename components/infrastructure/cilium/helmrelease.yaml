apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      # Keep in lockstep with ansible/group_vars/{all,phys}.yml (cilium_version) and the
      # cluster-chart ciliumVersion default — the phys lab validated 1.19.6. Flux always renders
      # values fresh from the ConfigMap below, so gotcha #24 (never --reuse-values on a bump)
      # does not apply to this HelmRelease path.
      version: "1.19.6"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  # Same values file the sandbox bootstrap (dev/lab/cilium-install.sh) uses — one source of
  # truth. Environment overlays add cilium-values.yaml on top via their own configMapGenerator.
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
