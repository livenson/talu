<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Talu architecture overview. Hand-authored SVG (presentation attributes only, no <style>/<filter>/webfonts) so GitHub renders it cleanly on light and dark. -->
  <rect x="6" y="6" width="988" height="718" rx="16" fill="#F7F5F0" stroke="#E2DDD3"/>

  <!-- title band -->
  <text x="28" y="56" font-size="34" font-weight="700" fill="#2E6A4E">Talu</text>
  <text x="112" y="56" font-size="18" fill="#26303B">— multitenant VM &amp; Kubernetes platform</text>
  <text x="28" y="80" font-size="12" fill="#616B76" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">API-first · orchestrator-agnostic · runs standalone (Git-first)</text>
  <text x="966" y="46" font-size="12.5" fill="#8A8578" font-style="italic" text-anchor="end">Estonian: farmstead — “own your ground”</text>
  <text x="966" y="66" font-size="11" fill="#A39D90" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="end">MIT · github.com/livenson/talu</text>

  <!-- ============ LEFT COLUMN: the layered stack ============ -->

  <!-- A: external / optional -->
  <rect x="28" y="100" width="662" height="56" rx="10" fill="#FFFFFF" stroke="#C9C3B8" stroke-dasharray="5 4"/>
  <text x="44" y="121" font-size="10.5" letter-spacing="1.2" fill="#8A8578">OPTIONAL · EXTERNAL — YOU DRIVE VIA THE API</text>
  <text x="44" y="143" font-size="12.5" fill="#26303B">Orchestrator · portal · CI (e.g. Waldur) — an optional consumer of the K8s + Prometheus API, never a dependency</text>

  <!-- arrow A -> B -->
  <line x1="359" y1="156" x2="359" y2="178" stroke="#C6871F" stroke-width="2"/>
  <polygon points="359,184 354,175 364,175" fill="#C6871F"/>
  <text x="372" y="174" font-size="10.5" fill="#8A8578" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">OIDC sign-in · apply labelled objects</text>

  <!-- B: access plane -->
  <rect x="28" y="182" width="662" height="92" rx="10" fill="#FBF3E4" stroke="#E4C98A"/>
  <text x="44" y="204" font-size="10.5" letter-spacing="1.2" fill="#B07715">ACCESS PLANE — THE ONLY INGRESS</text>
  <rect x="44" y="214" width="252" height="48" rx="8" fill="#C6871F"/>
  <text x="58" y="235" font-size="15" font-weight="700" fill="#FFFFFF">Pomerium</text>
  <text x="58" y="252" font-size="10.5" fill="#FBEAD0">IAP · Native SSH · kubectl · SSH User CA</text>
  <rect x="308" y="216" width="230" height="21" rx="5" fill="#FFFFFF" stroke="#E4C98A"/>
  <text x="318" y="230" font-size="11" fill="#26303B">OIDC IdP · Dex / Keycloak / ZITADEL</text>
  <rect x="308" y="241" width="230" height="21" rx="5" fill="#FFFFFF" stroke="#E4C98A"/>
  <text x="318" y="255" font-size="11" fill="#26303B">cert-manager · internal CA + TLS</text>
  <text x="552" y="230" font-size="10.5" fill="#9A7A3C">no public :22</text>
  <text x="552" y="245" font-size="10.5" fill="#9A7A3C">no static password</text>

  <!-- arrow B -> C -->
  <line x1="359" y1="274" x2="359" y2="296" stroke="#2E6A4E" stroke-width="2"/>
  <polygon points="359,302 354,293 364,293" fill="#2E6A4E"/>

  <!-- C: tenancy (TWO tenant products) -->
  <rect x="28" y="306" width="662" height="202" rx="10" fill="#EAF3EC" stroke="#BFDCC7"/>
  <text x="44" y="327" font-size="10.5" letter-spacing="1.2" fill="#2E6A4E">TENANCY — THE TENANT API (a HelmRelease you apply)</text>
  <text x="676" y="327" font-size="10" fill="#7C9A85" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">talu.io/project-uuid on every object</text>
  <text x="44" y="347" font-size="12.5" fill="#26303B">Flux renders a values file → a per-tenant namespace. Two flavours, same substrate:</text>

  <!-- left product: VM tenant -->
  <rect x="44" y="356" width="312" height="146" rx="8" fill="#FFFFFF" stroke="#BFDCC7"/>
  <text x="58" y="377" font-size="11.5" font-weight="700" fill="#2E6A4E">talu-tenant<tspan font-weight="400" fill="#5A6672"> · VM tenant</tspan></text>
  <g font-size="9.6" fill="#5A6672">
    <rect x="54" y="386" width="140" height="44" rx="6" fill="#F2F8F3" stroke="#CFE3D5"/>
    <text x="63" y="404" font-size="11" font-weight="700" fill="#26303B">VirtualMachines</text>
    <text x="63" y="420">KubeVirt VMs + disks</text>
    <rect x="202" y="386" width="140" height="44" rx="6" fill="#F2F8F3" stroke="#CFE3D5"/>
    <text x="211" y="404" font-size="11" font-weight="700" fill="#26303B">ssh Service + CNP</text>
    <text x="211" y="420">Pomerium-pinned :22</text>
    <rect x="54" y="434" width="140" height="44" rx="6" fill="#F2F8F3" stroke="#CFE3D5"/>
    <text x="63" y="452" font-size="11" font-weight="700" fill="#26303B">ResourceQuota · RBAC</text>
    <text x="63" y="468">scoped access + metering</text>
    <rect x="202" y="434" width="140" height="44" rx="6" fill="#F2F8F3" stroke="#CFE3D5"/>
    <text x="211" y="452" font-size="11" font-weight="700" fill="#26303B">cloud-init Secret</text>
    <text x="211" y="468">CA trust + guest secrets</text>
  </g>

  <!-- right product: managed Kubernetes (KaaS) -->
  <rect x="362" y="356" width="312" height="146" rx="8" fill="#FFFFFF" stroke="#BFDCC7"/>
  <text x="376" y="377" font-size="11.5" font-weight="700" fill="#2E6A4E">talu-cluster<tspan font-weight="400" fill="#5A6672"> · managed Kubernetes (KaaS)</tspan></text>
  <g font-size="9.6" fill="#5A6672">
    <rect x="372" y="386" width="140" height="44" rx="6" fill="#EEF5F4" stroke="#C9E0DB"/>
    <text x="381" y="404" font-size="11" font-weight="700" fill="#26303B">Kamaji control plane</text>
    <text x="381" y="420">hosted CP pods (not VMs)</text>
    <rect x="520" y="386" width="140" height="44" rx="6" fill="#EEF5F4" stroke="#C9E0DB"/>
    <text x="529" y="404" font-size="11" font-weight="700" fill="#26303B">KubeVirt workers</text>
    <text x="529" y="420">Cluster API + MHC self-heal</text>
    <rect x="372" y="434" width="140" height="44" rx="6" fill="#EEF5F4" stroke="#C9E0DB"/>
    <text x="381" y="452" font-size="11" font-weight="700" fill="#26303B">kubevirt-csi → Ceph</text>
    <text x="381" y="468">LB-IPAM tenant services</text>
    <rect x="520" y="434" width="140" height="44" rx="6" fill="#EEF5F4" stroke="#C9E0DB"/>
    <text x="529" y="452" font-size="11" font-weight="700" fill="#26303B">Pomerium kubectl</text>
    <text x="529" y="468">impersonation · own etcd</text>
  </g>

  <!-- arrow C -> D -->
  <line x1="359" y1="508" x2="359" y2="530" stroke="#46586A" stroke-width="2"/>
  <polygon points="359,536 354,527 364,527" fill="#46586A"/>

  <!-- D: virtualization -->
  <rect x="28" y="540" width="662" height="56" rx="10" fill="#EEF1F5" stroke="#CAD4DE"/>
  <text x="44" y="561" font-size="10.5" letter-spacing="1.2" fill="#46586A">VIRTUALIZATION</text>
  <text x="44" y="583" font-size="12.5" fill="#26303B">KubeVirt + CDI · golden images are <tspan font-weight="700">bootc</tspan> (auto-patch: CDI DataImportCron → zot registry)</text>

  <!-- arrow D -> E -->
  <line x1="359" y1="596" x2="359" y2="618" stroke="#5A6672" stroke-width="2"/>
  <polygon points="359,624 354,615 364,615" fill="#5A6672"/>

  <!-- E: substrate -->
  <rect x="28" y="628" width="662" height="66" rx="10" fill="#ECEEF0" stroke="#CFD4D9"/>
  <text x="44" y="650" font-size="10.5" letter-spacing="1.2" fill="#5A6672">SUBSTRATE — STANDARD &amp; SWAPPABLE</text>
  <text x="44" y="670" font-size="12.5" fill="#26303B">Talos Linux (immutable) · Cilium — network policy, LB-IPAM, no kube-proxy</text>
  <text x="44" y="686" font-size="12" fill="#5A6672">Rook-Ceph — RBD block + CephFS (RWX) · ceph-csi</text>

  <!-- ============ RIGHT RAIL: observability & ops (cross-cuts) ============ -->
  <rect x="704" y="182" width="268" height="512" rx="10" fill="#EAF0EC" stroke="#C4D6C9"/>
  <text x="720" y="204" font-size="10.5" letter-spacing="1.2" fill="#2E6A4E">OBSERVABILITY &amp; OPS</text>
  <text x="720" y="220" font-size="10" fill="#7C9A85" font-style="italic">one API set — VM tenants &amp; KaaS clusters alike</text>

  <!-- metrics -->
  <rect x="720" y="230" width="236" height="104" rx="8" fill="#FFFFFF" stroke="#C4D6C9"/>
  <text x="734" y="251" font-size="13" font-weight="700" fill="#2E6A4E">Metrics &amp; Alerts</text>
  <text x="734" y="270" font-size="11.5" fill="#26303B">Prometheus → Perses · Alertmanager</text>
  <text x="734" y="287" font-size="10" fill="#7C9A85" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">talu:tenant_* + alerting rules</text>
  <text x="734" y="305" font-size="10.5" fill="#5A6672">dashboards: fleet · alerts · per-tenant</text>
  <text x="734" y="322" font-size="10.5" fill="#5A6672">KaaS: cluster inventory + API probe</text>

  <!-- logs & audit -->
  <rect x="720" y="344" width="236" height="132" rx="8" fill="#FFFFFF" stroke="#C4D6C9"/>
  <text x="734" y="365" font-size="13" font-weight="700" fill="#2E6A4E">Logs &amp; Audit</text>
  <text x="734" y="384" font-size="11.5" fill="#26303B">Loki + Grafana Alloy → Perses</text>
  <text x="734" y="402" font-size="10.5" fill="#5A6672"><tspan font-weight="700" fill="#26303B">Access Audit</tspan> — who reached what</text>
  <text x="734" y="420" font-size="10.5" fill="#5A6672"><tspan font-weight="700" fill="#26303B">VM Logs</tspan> — inside the guests</text>
  <text x="748" y="436" font-size="10.5" fill="#5A6672">· operator (fleet) + per-tenant</text>
  <text x="748" y="452" font-size="10.5" fill="#5A6672">· platform-stamped labels (spoof-proof)</text>
  <text x="734" y="468" font-size="10" fill="#7C9A85" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">native in Perses — no Grafana</text>

  <!-- backup -->
  <rect x="720" y="486" width="236" height="118" rx="8" fill="#FFFFFF" stroke="#C4D6C9"/>
  <text x="734" y="507" font-size="13" font-weight="700" fill="#2E6A4E">Backup &amp; DR</text>
  <text x="734" y="526" font-size="11.5" fill="#26303B">Velero + kopia → Garage S3</text>
  <text x="734" y="543" font-size="10.5" fill="#5A6672">etcd snapshot · KubeVirt VM snapshots</text>
  <text x="734" y="560" font-size="10.5" fill="#5A6672">KaaS: per-tenant etcd + in-tenant Velero</text>
  <text x="734" y="577" font-size="10.5" fill="#5A6672">validated restore · weekly DR drill</text>
  <text x="734" y="595" font-size="10" fill="#7C9A85" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">off-cluster, three tiers</text>

  <!-- rail note -->
  <text x="720" y="632" font-size="10.5" fill="#5A6672">The rail cross-cuts every layer of the stack —</text>
  <text x="720" y="648" font-size="10.5" fill="#5A6672">metrics, logs and backup for VMs and clusters.</text>
  <text x="720" y="672" font-size="10" fill="#7C9A85" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">a stable contract for the orchestrator</text>

  <!-- observes connector (rail cross-cuts the stack) -->
  <line x1="704" y1="418" x2="696" y2="418" stroke="#7C9A85" stroke-width="1.6" stroke-dasharray="4 3"/>
  <polygon points="690,418 699,413 699,423" fill="#7C9A85"/>

  <!-- footer -->
  <line x1="28" y1="702" x2="972" y2="702" stroke="#E2DDD3"/>
  <text x="28" y="718" font-size="10.5" fill="#8A8578"><tspan font-weight="700" fill="#5A6672">components/</tspan> = the product (clone, don't edit)   ·   <tspan font-weight="700" fill="#5A6672">environments/&lt;site&gt;/</tspan> = your values (overlay)   ·   pull upstream = a clean git merge</text>
</svg>
