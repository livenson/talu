---
# Deploys Rook-Ceph (RBD) on the physical cluster. Runs on the gateway (kubeconfig + helm + talosctl).
- name: Shorthands
  ansible.builtin.set_fact:
    _k: "kubectl --kubeconfig={{ rook_kubeconfig }}"
    _h: "{{ rook_helm_bin }}"
    _cp_ips: "{{ talos_nodes | selectattr('role','equalto','controlplane') | map(attribute='ip') | list }}"

  # ── make control planes schedulable so OSDs/mons can spread across ≥3 hosts (host failure domain) ──
  # NB: the --endpoints/--nodes FLAGS take a COMMA-joined list (unlike the `config endpoint`
  # subcommand which takes separate positional args). Space-separated args get mis-parsed as a
  # subcommand ("unknown command").
- name: Allow scheduling on control planes (Talos config patch, no reboot)
  ansible.builtin.command:
    argv:
      - talosctl
      - "--talosconfig={{ talos_gen_dir }}/talosconfig"
      - "--endpoints={{ _cp_ips | join(',') }}"
      - "--nodes={{ _cp_ips | join(',') }}"
      - patch
      - mc
      - "--mode=no-reboot"
      - "--patch=[{\"op\":\"add\",\"path\":\"/cluster/allowSchedulingOnControlPlanes\",\"value\":true}]"
  register: sched_patch
  changed_when: "'patched' in sched_patch.stdout or sched_patch.rc == 0"
  failed_when: sched_patch.rc != 0 and 'no changes' not in (sched_patch.stderr | default(''))

- name: Wait for the control-plane taint to be removed
  ansible.builtin.shell: >-
    {{ _k }} get nodes -o jsonpath='{range .items[*]}{.spec.taints[?(@.key=="node-role.kubernetes.io/control-plane")].key}{"\n"}{end}'
    | grep -c control-plane || true
  register: taint_count
  until: taint_count.stdout | trim == "0"
  retries: 20
  delay: 6
  changed_when: false

# ── external-snapshotter (CRDs + controller) — Talos/k8s does not ship these ──
- name: Install snapshot CRDs + controller (retried through flaky egress)
  ansible.builtin.command: "{{ _k }} apply --server-side --force-conflicts -f {{ item }}"
  loop:
    - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml"
    - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml"
    - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml"
  register: snap_crds
  retries: 6
  delay: 5
  until: snap_crds.rc == 0
  changed_when: "'created' in snap_crds.stdout or 'configured' in snap_crds.stdout"

- name: Deploy the snapshot-controller
  ansible.builtin.command: "{{ _k }} apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/deploy/kubernetes/snapshot-controller/{{ item }}"
  loop: [rbac-snapshot-controller.yaml, setup-snapshot-controller.yaml]
  register: snap_ctrl
  retries: 6
  delay: 5
  until: snap_ctrl.rc == 0
  changed_when: "'created' in snap_ctrl.stdout or 'configured' in snap_ctrl.stdout"

# ── Rook operator + cluster (helm; charts pulled to local tgz with retries) ──
- name: Add rook helm repo
  ansible.builtin.command: "{{ _h }} repo add rook-release https://charts.rook.io/release"
  changed_when: false
  failed_when: false

- name: Add the ceph-csi-operator helm repo (hosts the ceph-csi-drivers chart)
  ansible.builtin.command: "{{ _h }} repo add ceph-csi-operator {{ ceph_csi_operator_helm_repo }}"
  changed_when: false
  failed_when: false

- name: Pull rook charts to local tgz (retry through flaky egress)
  ansible.builtin.command: "{{ _h }} pull {{ item.repo }}/{{ item.chart }} --version {{ item.ver }} -d {{ talos_gen_dir }}"
  args: { creates: "{{ item.tgz }}" }
  loop:
    - { repo: rook-release, chart: rook-ceph,         ver: "{{ rook_version }}",             tgz: "{{ rook_operator_chart_tgz }}" }
    - { repo: ceph-csi-operator, chart: ceph-csi-drivers, ver: "{{ ceph_csi_drivers_version }}", tgz: "{{ rook_csi_drivers_chart_tgz }}" }
    - { repo: rook-release, chart: rook-ceph-cluster, ver: "{{ rook_version }}",             tgz: "{{ rook_cluster_chart_tgz }}" }
  loop_control: { label: "{{ item.chart }}" }
  register: rook_pull
  retries: 15
  delay: 5
  until: rook_pull is not failed

- name: Install rook-ceph operator
  ansible.builtin.command:
    argv:
      - "{{ _h }}"
      - upgrade
      - --install
      - rook-ceph
      - "{{ rook_operator_chart_tgz }}"
      - "--namespace={{ rook_namespace }}"
      - --create-namespace
      - --wait
      - --timeout=6m
  environment: { KUBECONFIG: "{{ rook_kubeconfig }}" }
  register: rook_op
  changed_when: "'has been' in rook_op.stdout"

# installCsiOperator=true installs the csi-operator controller + CRDs, but does NOT switch the rook
# operator into csi-operator mode — it only creates the ClientProfile/CephConnection CRs (with real
# mon data) that the csi-operator needs when CSI_ENABLE_CSI_OPERATOR=true. Set it and restart.
- name: Enable the csi-operator handoff in the operator config
  ansible.builtin.command: >-
    {{ _k }} -n {{ rook_namespace }} patch cm rook-ceph-operator-config --type merge
    -p '{"data":{"CSI_ENABLE_CSI_OPERATOR":"true"}}'
  register: csi_op_flag
  changed_when: true

- name: Restart the operator to pick up the flag
  ansible.builtin.command: "{{ _k }} -n {{ rook_namespace }} rollout restart deploy/rook-ceph-operator"
  changed_when: true

- name: Wait for the operator rollout
  ansible.builtin.command: "{{ _k }} -n {{ rook_namespace }} rollout status deploy/rook-ceph-operator --timeout=180s"
  changed_when: false

# Talos enforces PodSecurity baseline cluster-wide; Ceph daemons are privileged (lab-notes #5).
# Label BEFORE the CSI/cluster charts so their privileged pods (csi plugins, OSDs) admit.
- name: Label the rook namespace privileged (PSA)
  ansible.builtin.command: >-
    {{ _k }} label namespace {{ rook_namespace }}
    pod-security.kubernetes.io/enforce=privileged
    pod-security.kubernetes.io/warn=privileged
    pod-security.kubernetes.io/audit=privileged --overwrite
  changed_when: true

# The packaging Rook omits: creates the Driver + OperatorConfig CRs, the rbd/cephfs ctrlplugin+
# nodeplugin ServiceAccounts, and their RBAC — so the ceph-csi-operator's driver pods actually start.
- name: Render ceph-csi-drivers values
  ansible.builtin.template:
    src: ceph-csi-drivers-values.yaml.j2
    dest: "{{ talos_gen_dir }}/ceph-csi-drivers-values.yaml"
    mode: "0644"

- name: Install ceph-csi-drivers (Driver/OperatorConfig CRs + ServiceAccounts + RBAC)
  ansible.builtin.command:
    argv:
      - "{{ _h }}"
      - upgrade
      - --install
      - ceph-csi-drivers
      - "{{ rook_csi_drivers_chart_tgz }}"
      - "--namespace={{ rook_namespace }}"
      - "--values={{ talos_gen_dir }}/ceph-csi-drivers-values.yaml"
      - --timeout=5m
  environment: { KUBECONFIG: "{{ rook_kubeconfig }}" }
  register: rook_csi
  changed_when: "'has been' in rook_csi.stdout"

- name: Render cluster values
  ansible.builtin.template:
    src: rook-cluster-values.yaml.j2
    dest: "{{ talos_gen_dir }}/rook-cluster-values.yaml"
    mode: "0644"

- name: Install rook-ceph-cluster (CephCluster + block pool + StorageClass)
  ansible.builtin.command:
    argv:
      - "{{ _h }}"
      - upgrade
      - --install
      - rook-ceph-cluster
      - "{{ rook_cluster_chart_tgz }}"
      - "--namespace={{ rook_namespace }}"
      - "--values={{ talos_gen_dir }}/rook-cluster-values.yaml"
      - --timeout=6m
  environment: { KUBECONFIG: "{{ rook_kubeconfig }}" }
  register: rook_cl
  changed_when: "'has been' in rook_cl.stdout"

- name: RBD VolumeSnapshotClass
  ansible.builtin.copy:
    dest: "{{ talos_gen_dir }}/rbd-snapshotclass.yaml"
    content: "{{ lookup('template', 'rbd-snapshotclass.yaml.j2') }}"
    mode: "0644"

- name: Apply the RBD VolumeSnapshotClass
  ansible.builtin.command: "{{ _k }} apply -f {{ talos_gen_dir }}/rbd-snapshotclass.yaml"
  register: snapclass
  retries: 10
  delay: 6
  until: snapclass.rc == 0
  changed_when: "'created' in snapclass.stdout or 'configured' in snapclass.stdout"

# ── wait for Ceph health ──
- name: Wait for the CephCluster to reach Ready/HEALTH_OK
  ansible.builtin.shell: >-
    {{ _k }} -n {{ rook_namespace }} get cephcluster -o jsonpath='{.items[0].status.ceph.health}{" "}{.items[0].status.phase}'
  register: ceph_health
  until: "'HEALTH_OK' in ceph_health.stdout or 'HEALTH_WARN' in ceph_health.stdout"
  retries: 60
  delay: 15
  changed_when: false

- name: Storage status
  ansible.builtin.shell: |
    {{ _k }} -n {{ rook_namespace }} get cephcluster -o wide 2>&1 | tail -3
    echo "--- storageclasses ---"; {{ _k }} get storageclass 2>&1
    echo "--- osds ---"; {{ _k }} -n {{ rook_namespace }} get pods -l app=rook-ceph-osd -o wide 2>&1 | tail -6
  register: storage_status
  changed_when: false

- name: Show storage status
  ansible.builtin.debug:
    msg: "{{ storage_status.stdout_lines }}"
