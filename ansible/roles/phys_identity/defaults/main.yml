---
# Identity & access: Dex (OIDC IdP) + Pomerium (IAP) on the physical cluster. Pomerium is exposed
# on the ingress LB IP (compute2 DNATs the public :80/:443 there); autocert gets Let's Encrypt certs
# for *.<lab_domain> over that path. Protects Perses + Hubble UI behind Dex OIDC.
id_k: "kubectl --kubeconfig={{ talos_gen_dir }}/kubeconfig"
id_kubeconfig: "{{ talos_gen_dir }}/kubeconfig"
pomerium_version: "v0.33.0"        # matches all.yml pin

# ACME contact address for the Let's Encrypt ClusterIssuers (adr-pomerium-ingress.md §3b). Optional:
# left empty the issuers register without a contact, which LE permits. Set it per site to get expiry
# warnings — the lab has no real mailbox, so it stays empty here rather than carrying a fake address.
acme_email: ""
# The ingressClass the HTTP-01 solver publishes its challenge on. Must match the IngressClass the
# Pomerium controller serves; the CRD reference names this as the way to solve HTTP-01 for Pomerium.
acme_solver_ingress_class: pomerium

# ── The Pomerium Ingress Controller's global config object (adr-pomerium-ingress.md §3b/§7.1) ────
pomerium_namespace: pomerium
pomerium_ingress_class: pomerium
pomerium_bootstrap_secret: pomerium-bootstrap
pomerium_idp_secret: pomerium-idp
pomerium_storage_secret: pomerium-storage
# STAGING until every route class is verified; production is a one-line change afterwards (§3b).
pomerium_acme_cluster_issuer: letsencrypt-staging

# The Ingress Controller image, served from the PUSHABLE local registry rather than a pull-through
# cache. registry:2 in proxy mode still resolves tag->manifest upstream, so a warm cache does not
# protect a cutover from a flaky WAN (lab-notes #42). Mirror it before changing this:
#   sudo podman pull --tls-verify=false 10.8.1.101:5000/pomerium/ingress-controller:<tag>
#   sudo podman tag  ... 10.8.1.101:5010/pomerium-ingress-controller:<tag> && podman push --tls-verify=false ...
pomerium_ic_image: "talu.registry/pomerium-ingress-controller:v0.33.1"
# Deploy the controller. Off by default so a site that has not staged the prerequisites (§7.8) cannot
# replace its access plane by running the role.
pomerium_ingress_enabled: false
