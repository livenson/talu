---
- name: Deploy Dex (OIDC IdP)
  ansible.builtin.template:
    src: dex.yaml.j2
    dest: "{{ talos_gen_dir }}/dex.yaml"
    mode: "0644"

- name: Apply Dex
  ansible.builtin.command: "{{ id_k }} apply -f {{ talos_gen_dir }}/dex.yaml"
  register: dex_apply
  changed_when: "'created' in dex_apply.stdout or 'configured' in dex_apply.stdout"

- name: Wait for Dex ready
  ansible.builtin.command: "{{ id_k }} -n identity rollout status deploy/dex --timeout=120s"
  changed_when: false

# Pomerium shared + cookie secrets — 32 random bytes each, created once (never rotated in place).
- name: Pomerium namespace
  ansible.builtin.command: "{{ id_k }} create ns pomerium --dry-run=client -o yaml"
  register: pom_ns
  changed_when: false
- ansible.builtin.command: "{{ id_k }} apply -f -"
  args: { stdin: "{{ pom_ns.stdout }}" }
  changed_when: true

- name: Pomerium secrets present?
  ansible.builtin.command: "{{ id_k }} -n pomerium get secret pomerium-secrets"
  register: pom_sec
  changed_when: false
  failed_when: false

- name: Create pomerium-secrets (shared + cookie)
  ansible.builtin.shell: |
    {{ id_k }} -n pomerium create secret generic pomerium-secrets \
      --from-literal=SHARED_SECRET="$(openssl rand -base64 32)" \
      --from-literal=COOKIE_SECRET="$(openssl rand -base64 32)"
  when: pom_sec.rc != 0
  changed_when: true

# Native SSH — Pomerium is the SSH CA. Generate the User CA + host keys ONCE (never rotated in place;
# rotation is dev/lab/ca-rotate.sh). The private CA + host keys go in Secret pomerium-ssh (the Deployment
# mounts it at /ssh, so it MUST exist before Pomerium starts); the CA PUBLIC key goes in ConfigMap
# pomerium-user-ca, which the tenancy role mirrors into the tenants ns and the tenant chart bakes into
# each VM's cloud-init as TrustedUserCAKeys. The tenant chart REQUIRES a non-empty sshUserCaPubKey in
# its default caTrust mode, so this is a hard prerequisite for tenancy, not optional.
- name: Pomerium SSH CA present?
  ansible.builtin.command: "{{ id_k }} -n pomerium get secret pomerium-ssh"
  register: pom_ssh_ca
  changed_when: false
  failed_when: false

- name: Generate the Pomerium SSH User CA + host keys (one-time)
  ansible.builtin.shell: |
    set -euo pipefail
    T=$(mktemp -d); trap 'rm -rf "$T"' EXIT; cd "$T"
    ssh-keygen -t ed25519 -N "" -f user_ca -C "Pomerium User CA (talu phys)" -q
    ssh-keygen -t ed25519 -N "" -f host_ed25519 -C "pomerium-ssh host" -q
    ssh-keygen -t rsa -b 4096 -N "" -f host_rsa -q
    ssh-keygen -t ecdsa -b 521 -N "" -f host_ecdsa -q
    {{ id_k }} -n pomerium create secret generic pomerium-ssh \
      --from-file=user_ca=user_ca --from-file=user_ca.pub=user_ca.pub \
      --from-file=host_ed25519=host_ed25519 --from-file=host_rsa=host_rsa --from-file=host_ecdsa=host_ecdsa
    {{ id_k }} -n pomerium create configmap pomerium-user-ca --from-file=user_ca.pub=user_ca.pub
  when: pom_ssh_ca.rc != 0
  changed_when: true

# ── Ingress-controller prerequisite: the same SSH material as four ssh-auth Secrets ───────────────
# The Pomerium CRD takes SSH material as SECRET REFERENCES (spec.ssh.userCaKeySecret,
# spec.ssh.hostKeySecrets[]), not the file paths the current config.yaml uses, and the controller
# REQUIRES each to be of type kubernetes.io/ssh-auth with the key `ssh-privatekey`:
# SSHSecrets.Validate() rejects any other type and applySSH() errors on a missing key
# (adr-pomerium-ingress.md §7.1). pomerium-ssh is ONE Opaque Secret with five keys, so it cannot be
# referenced as-is — hence four derived Secrets, one per key.
#
# DERIVED, never regenerated. Every tenant VM already trusts the CA's public half via cloud-init
# TrustedUserCAKeys, so a freshly generated CA would lock every existing VM out of SSH. The next task
# proves the derived CA is still the one the VMs trust rather than assuming it.
#
# pomerium-ssh itself is deliberately left in place: the running Pomerium mounts it at /ssh, and it is
# the rollback. Nothing reads these four until the controller exists, so this is inert.
- name: Derive the ssh-auth Secrets the Pomerium CRD requires (from pomerium-ssh, never regenerated)
  ansible.builtin.shell: |
    set -euo pipefail
    T=$(mktemp -d); trap 'rm -rf "$T"' EXIT
    changed=0
    emit() {   # <key in pomerium-ssh> <new Secret name>
      {{ id_k }} -n pomerium get secret pomerium-ssh -o "jsonpath={.data.$1}" | base64 -d > "$T/k"
      [ -s "$T/k" ] || { echo "FATAL: pomerium-ssh has no key '$1'" >&2; exit 1; }
      want=$(base64 < "$T/k" | tr -d '\n')
      cur=$({{ id_k }} -n pomerium get secret "$2" -o jsonpath='{.data.ssh-privatekey}' 2>/dev/null || true)
      if [ "$cur" = "$want" ]; then echo "ok   $2 (unchanged)"; return; fi
      {{ id_k }} -n pomerium create secret generic "$2" \
        --type=kubernetes.io/ssh-auth --from-file=ssh-privatekey="$T/k" \
        --dry-run=client -o yaml | {{ id_k }} apply -f - >/dev/null
      echo "set  $2"
      changed=1
    }
    emit user_ca      pomerium-ssh-user-ca
    emit host_ed25519 pomerium-ssh-host-ed25519
    emit host_rsa     pomerium-ssh-host-rsa
    emit host_ecdsa   pomerium-ssh-host-ecdsa
    echo "CHANGED=$changed"
  args: { executable: /bin/bash }
  register: pom_ssh_auth
  changed_when: "'CHANGED=1' in pom_ssh_auth.stdout"
  tags: [ssh-secrets]

# Prove the end behaviour, don't infer it: the whole risk in the task above is a CA that is not the
# one tenant VMs trust. Compare the public key derived from the new Secret against pomerium-user-ca —
# the ConfigMap the tenant chart bakes into every VM's cloud-init. If these ever differ, every VM's
# SSH breaks at the swap, so fail the play here rather than discover it after the cutover.
- name: Verify the derived User CA is the key tenant VMs actually trust
  ansible.builtin.shell: |
    set -euo pipefail
    T=$(mktemp -d); trap 'rm -rf "$T"' EXIT
    {{ id_k }} -n pomerium get secret pomerium-ssh-user-ca \
      -o jsonpath='{.data.ssh-privatekey}' | base64 -d > "$T/ca"
    chmod 600 "$T/ca"
    derived=$(ssh-keygen -y -f "$T/ca" | awk '{print $1" "$2}')
    trusted=$({{ id_k }} -n pomerium get cm pomerium-user-ca \
      -o "jsonpath={.data.user_ca\.pub}" | awk '{print $1" "$2}')
    if [ "$derived" != "$trusted" ]; then
      echo "FATAL: derived User CA is NOT the CA tenant VMs trust — every VM would lose SSH" >&2
      exit 1
    fi
    for s in pomerium-ssh-host-ed25519 pomerium-ssh-host-rsa pomerium-ssh-host-ecdsa; do
      t=$({{ id_k }} -n pomerium get secret "$s" -o jsonpath='{.type}')
      [ "$t" = "kubernetes.io/ssh-auth" ] || { echo "FATAL: $s is type '$t'" >&2; exit 1; }
    done
    echo "User CA matches pomerium-user-ca; 3 host key Secrets are kubernetes.io/ssh-auth"
  args: { executable: /bin/bash }
  register: pom_ssh_auth_verify
  changed_when: false
  tags: [ssh-secrets]

# ── Ingress-controller prerequisite: the bootstrap Secret (spec.secrets, REQUIRED) ────────────────
# spec.secrets is mandatory on the CRD and has no equivalent today. It needs three keys:
#
#   shared_secret / cookie_secret — EXACTLY 32 RAW BYTES each. bootstrap.go rejects anything else
#     ("key %s should be %d bytes, got %d") and base64-encodes them itself. pomerium-secrets holds
#     the base64 TEXT of those bytes (44 chars) because the current Deployment passes them as env
#     vars — so this DECODES them rather than copying. Copying verbatim yields "got 44" and a
#     Pomerium that will not start.
#   signing_key — an ECDSA P-256 private key in PEM, matching cryptutil.NewSigningKey() +
#     EncodePrivateKey(). Optional in code (len -1, so a missing key is not an error), but leaving
#     it unset means unsigned JWT assertions, so set it.
#
# Carrying the existing shared/cookie values across (rather than minting new ones, as the bundled
# pomerium-gen-secrets Job would) keeps inter-service auth and session cookies continuous, and avoids
# that Job's floating `:main` image pin. signing_key has no predecessor, so it is generated once and
# then REUSED — re-running must not rotate it under a live Pomerium.
# Inert: nothing reads this Secret until the controller exists.
- name: Build the Pomerium bootstrap Secret (spec.secrets) from the existing values
  ansible.builtin.shell: |
    set -euo pipefail
    T=$(mktemp -d); trap 'rm -rf "$T"' EXIT
    for pair in SHARED_SECRET:shared_secret COOKIE_SECRET:cookie_secret; do
      src=${pair%%:*}; dst=${pair##*:}
      {{ id_k }} -n pomerium get secret pomerium-secrets -o "jsonpath={.data.$src}" \
        | base64 -d | base64 -d > "$T/$dst"
      n=$(wc -c < "$T/$dst")
      [ "$n" -eq 32 ] || { echo "FATAL: $src decodes to $n bytes, Pomerium requires exactly 32" >&2; exit 1; }
    done
    cur_sk=$({{ id_k }} -n pomerium get secret pomerium-bootstrap \
      -o jsonpath='{.data.signing_key}' 2>/dev/null || true)
    if [ -n "$cur_sk" ]; then
      printf '%s' "$cur_sk" | base64 -d > "$T/signing_key"      # reuse — never rotate on re-run
    else
      openssl ecparam -genkey -name prime256v1 -noout -out "$T/signing_key"
    fi
    same=1
    for k in shared_secret cookie_secret signing_key; do
      cur=$({{ id_k }} -n pomerium get secret pomerium-bootstrap -o "jsonpath={.data.$k}" 2>/dev/null || true)
      want=$(base64 < "$T/$k" | tr -d '\n')
      [ "$cur" = "$want" ] || same=0
    done
    if [ "$same" -eq 1 ]; then
      echo "ok   pomerium-bootstrap (unchanged)"
      echo "CHANGED=0"
    else
      {{ id_k }} -n pomerium create secret generic pomerium-bootstrap \
        --from-file=shared_secret="$T/shared_secret" \
        --from-file=cookie_secret="$T/cookie_secret" \
        --from-file=signing_key="$T/signing_key" \
        --dry-run=client -o yaml | {{ id_k }} apply -f - >/dev/null
      echo "set  pomerium-bootstrap"
      echo "CHANGED=1"
    fi
  args: { executable: /bin/bash }
  register: pom_bootstrap
  changed_when: "'CHANGED=1' in pom_bootstrap.stdout"
  tags: [bootstrap-secret]

# Again, prove it rather than assume it. The failure this guards is a bootstrap Secret that looks
# right and is rejected at startup — 32-byte lengths, and continuity with the values the running
# Pomerium uses today (re-encoding must reproduce them exactly, or sessions and inter-service auth
# break at the swap for no reason).
- name: Verify the bootstrap Secret against Pomerium's own constraints
  ansible.builtin.shell: |
    set -euo pipefail
    T=$(mktemp -d); trap 'rm -rf "$T"' EXIT
    for pair in shared_secret:SHARED_SECRET cookie_secret:COOKIE_SECRET; do
      new=${pair%%:*}; old=${pair##*:}
      {{ id_k }} -n pomerium get secret pomerium-bootstrap -o "jsonpath={.data.$new}" \
        | base64 -d > "$T/$new"
      n=$(wc -c < "$T/$new")
      [ "$n" -eq 32 ] || { echo "FATAL: $new is $n bytes, Pomerium requires exactly 32" >&2; exit 1; }
      want=$({{ id_k }} -n pomerium get secret pomerium-secrets -o "jsonpath={.data.$old}" | base64 -d)
      got=$(base64 < "$T/$new" | tr -d '\n')
      [ "$got" = "$want" ] || { echo "FATAL: $new does not round-trip to the live $old" >&2; exit 1; }
    done
    {{ id_k }} -n pomerium get secret pomerium-bootstrap -o jsonpath='{.data.signing_key}' \
      | base64 -d > "$T/sk"
    openssl ec -in "$T/sk" -noout 2>/dev/null || { echo "FATAL: signing_key is not a valid EC key" >&2; exit 1; }
    echo "bootstrap Secret OK: 32-byte shared/cookie secrets round-tripping to the live values, EC signing key"
  args: { executable: /bin/bash }
  register: pom_bootstrap_verify
  changed_when: false
  tags: [bootstrap-secret]

# ── Ingress-controller prerequisite: the IdP client Secret (identityProvider.secret) ──────────────
# The CRD only accepts a Secret reference for the OIDC client, with keys `client_id` and
# `client_secret`. Today idp_client_secret is templated in PLAINTEXT into the pomerium-config
# ConfigMap, so this also removes a credential from a non-Secret object — a small security
# improvement that falls out of the migration (adr-pomerium-ingress.md §7.1).
#
# Sourced from the same `pomerium_idp_client_secret` var that Dex's own client entry uses, so the two
# sides cannot drift. no_log because the value is interpolated into the task.
# Inert: nothing reads this Secret until the controller exists.
- name: Build the IdP client Secret (identityProvider.secret)
  ansible.builtin.shell: |
    set -euo pipefail
    {{ id_k }} -n pomerium create secret generic pomerium-idp \
      --from-literal=client_id=pomerium \
      --from-literal=client_secret='{{ pomerium_idp_client_secret }}' \
      --dry-run=client -o yaml | {{ id_k }} apply -f -
  args: { executable: /bin/bash }
  register: pom_idp
  changed_when: "'unchanged' not in pom_idp.stdout"
  no_log: true
  tags: [idp-secret]

# The failure this guards is silent and total: a client_secret that does not match Dex's means every
# OIDC login fails at the token exchange, with Pomerium and Dex both reporting healthy.
#
# Compared against the LIVE dex-config, not against the var this Secret was just written from —
# comparing a value to itself proves nothing, and the drift that actually bites is a Dex deployed
# from an older value. Hashes only, so neither secret reaches the log.
- name: Verify the IdP client Secret matches Dex's live client entry
  ansible.builtin.shell: |
    set -euo pipefail
    id=$({{ id_k }} -n pomerium get secret pomerium-idp -o jsonpath='{.data.client_id}' | base64 -d)
    [ "$id" = "pomerium" ] || { echo "FATAL: client_id is '$id', Dex expects 'pomerium'" >&2; exit 1; }
    ours=$({{ id_k }} -n pomerium get secret pomerium-idp -o jsonpath='{.data.client_secret}' \
      | base64 -d | sha256sum | cut -d' ' -f1)
    # Capture first, then hash with printf: `awk print` appends a newline, and hashing "secret\n"
    # against the raw "secret" held in the Secret mismatches every time.
    # (No apostrophes in this block: ansible split_args counts quotes across comments too, and an
    # unbalanced one fails the whole play with "unbalanced jinja2 block or quotes".)
    dexsec=$({{ id_k }} -n identity get cm dex-config -o "jsonpath={.data.config\.yaml}" \
      | awk '/- id: pomerium$/{f=1} f && /secret:/{print $2; exit}')
    [ -n "$dexsec" ] || { echo "FATAL: could not read the Dex pomerium client secret" >&2; exit 1; }
    dex=$(printf '%s' "$dexsec" | sha256sum | cut -d' ' -f1)
    [ "$ours" = "$dex" ] || { echo "FATAL: pomerium-idp client_secret does not match Dex — every OIDC login would fail" >&2; exit 1; }
    echo "IdP client Secret OK: client_id=pomerium, client_secret matches the LIVE Dex client entry"
  args: { executable: /bin/bash }
  register: pom_idp_verify
  changed_when: false
  tags: [idp-secret]

# ── Ingress-controller prerequisite: ACME ClusterIssuers ─────────────────────────────────────────
# certificateAutoProvision hands issuance to cert-manager (adr-pomerium-ingress.md §3b), so the
# issuers must exist before the swap. phys_cert_manager deliberately ships only the `selfsigned`
# root and leaves ACME to "the layers that need them" — this is that layer.
#
# BOTH are created, and staging is the one to iterate against. lab-notes records an hour-long Let's
# Encrypt lockout here ("too many failed authorizations (5) per hostname per hour") caused by
# retrying against PROD over the flaky inbound :80/:443 forward, after which Pomerium served the
# wrong hostname certificate and broke OIDC login even for hosts whose certs were fine. Staging has
# far higher limits and the same failure modes, so it is where the cutover gets debugged.
#
# HTTP-01 is solved through the `pomerium` ingressClass, which is the path the CRD reference names.
# That means the solver only works ONCE the controller is serving — see the note below on why no
# Certificate is created yet.
#
# Creating an issuer is itself inert: cert-manager registers an ACME account and stores its key, and
# issues nothing until a Certificate asks. That registration doubles as an early, cheap check that
# ACME is reachable at all from this cluster.
- name: ACME ClusterIssuers (Let's Encrypt staging + production)
  ansible.builtin.shell: |
    cat <<'EOF' | {{ id_k }} apply -f -
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: letsencrypt-staging}
    spec:
      acme:
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        {{ ('email: ' ~ acme_email) if acme_email else '' }}
        privateKeySecretRef: {name: letsencrypt-staging-account-key}
        solvers:
          - http01: {ingress: {ingressClassName: {{ acme_solver_ingress_class }}}}
    ---
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: letsencrypt-prod}
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        {{ ('email: ' ~ acme_email) if acme_email else '' }}
        privateKeySecretRef: {name: letsencrypt-prod-account-key}
        solvers:
          - http01: {ingress: {ingressClassName: {{ acme_solver_ingress_class }}}}
    EOF
  args: { executable: /bin/bash }
  register: pom_acme
  changed_when: "'created' in pom_acme.stdout or 'configured' in pom_acme.stdout"
  tags: [acme-issuers]

# An issuer that exists but never reached Ready is the silent-failure shape again: it looks installed
# and fails at the moment a certificate is actually needed. Registration requires egress to the ACME
# endpoint, so this doubles as the reachability check — and it is far better to learn that here than
# during the cutover.
- name: Wait for both ACME ClusterIssuers to become Ready
  ansible.builtin.command: >-
    {{ id_k }} wait --for=condition=Ready clusterissuer/letsencrypt-staging
    clusterissuer/letsencrypt-prod --timeout=180s
  register: pom_acme_ready
  changed_when: false
  tags: [acme-issuers]

# NOTE — deliberately NOT created here: the Certificate for authenticate.<domain>.
#
# §7.3: that hostname is the one route certificateAutoProvision does NOT cover (settings records
# contribute certificate names, never route names, so it is never "missing"), so it needs an explicit
# Secret referenced from the CRD certificates list. But a Certificate is NOT inert — cert-manager
# starts an Order immediately, the HTTP-01 solver publishes on the `pomerium` ingressClass, and until
# the controller is serving nothing answers the challenge. It would fail, retry, and spend exactly
# the failed-authorization budget that caused the lockout above.
#
# So it belongs to the swap step, against STAGING first. Creating it now would be the one part of
# this preparation that is not free.

# The external domain is a per-environment VALUE (it tracks the floating IP). Both Pomerium's route
# renderer (route-sync) and any other consumer read it from the talu-platform ConfigMap — the single
# source of truth (gotcha #40), so a reinstall with a new IP updates one place. Without it route-sync's
# pod fails its env ref and never runs, leaving the routes stale.
- name: Publish the external domain (talu-platform ConfigMap, pomerium ns — route-sync reads it there)
  ansible.builtin.shell: >-
    {{ id_k }} -n pomerium create configmap talu-platform
    --from-literal=domain={{ lab_domain }} --dry-run=client -o yaml | {{ id_k }} apply -f -
  changed_when: true

# The static Pomerium base for route-sync (route-sync appends the dynamic per-Service routes on top).
- name: Publish the Pomerium base config (pomerium-base ConfigMap)
  ansible.builtin.template:
    src: pomerium-base.yaml.j2
    dest: "{{ talos_gen_dir }}/pomerium-base.yaml"
    mode: "0644"
- ansible.builtin.command: "{{ id_k }} apply -f {{ talos_gen_dir }}/pomerium-base.yaml"
  changed_when: true

- name: Deploy Pomerium (IAP)
  ansible.builtin.template:
    src: pomerium.yaml.j2
    dest: "{{ talos_gen_dir }}/pomerium.yaml"
    mode: "0644"

- name: Apply Pomerium
  ansible.builtin.command: "{{ id_k }} apply -f {{ talos_gen_dir }}/pomerium.yaml"
  register: pom_apply
  changed_when: "'created' in pom_apply.stdout or 'configured' in pom_apply.stdout"

- name: Wait for Pomerium ready (autocert can take a minute)
  ansible.builtin.command: "{{ id_k }} -n pomerium rollout status deploy/pomerium --timeout=240s"
  changed_when: false
  failed_when: false
  register: pom_ready

- name: Read the assigned LB IP
  ansible.builtin.command: "{{ id_k }} -n pomerium get svc pomerium -o jsonpath={.status.loadBalancer.ingress[0].ip}"
  register: pom_lbip
  changed_when: false

- name: Status
  ansible.builtin.shell: |
    echo "dex:      $({{ id_k }} -n identity get pods -l app=dex --no-headers 2>/dev/null | awk '{print $3}')"
    echo "pomerium: $({{ id_k }} -n pomerium get pods -l app=pomerium --no-headers 2>/dev/null | awk '{print $3}')"
    echo "pomerium LB IP: {{ pom_lbip.stdout | default('none') }} (want {{ talos_ingress_lb_ip }})"
    echo "routes: id.{{ lab_domain }} (dex) · perses.{{ lab_domain }} · hubble.{{ lab_domain }}"
  register: id_status
  changed_when: false

- name: Show
  ansible.builtin.debug:
    msg: "{{ id_status.stdout_lines }}"

# ── Pomerium route as an Ingress (adr-pomerium-ingress.md §3b) ────────────────────────────────────
# Dex itself. Public (it IS the login page) and preserve_host_header, matching the route
# route-sync renders today.
# Inert until the Ingress Controller is serving; the route-sync path is unchanged meanwhile.
- name: Pomerium route — id (Ingress)
  ansible.builtin.include_role:
    name: phys_pomerium_route
  vars:
    pr_name: pomerium-route-id
    pr_namespace: identity
    pr_host: "id.{{ lab_domain }}"
    pr_service: dex
    pr_port: 5556
    pr_public: true
    pr_preserve_host: true
  tags: [pomerium-routes]
