---
# Tenant control plane — tenant-as-HelmRelease (Cozystack-style: chart + HelmRelease, no aggregation
# apiserver, no Git). Installs Flux's source + helm controllers, stands up the in-cluster chart registry
# + OCIRepository sources + route-sync, publishes the talu-tenant + talu-vm charts, and reconciles each
# environments/<tenant_env>/tenants/<slug>/{tenant.yaml,vms/*.yaml} as a HelmRelease. Since the chart
# split (adr-api-layer.md §10.1) a tenant is one object for the namespace half and one per VM.
# Design + validated round-trip: components/tenancy/flux/README.md.
- name: Tenancy dirs (on the lab, from the synced repo)
  ansible.builtin.set_fact:
    flux_dir: "{{ playbook_dir }}/../components/tenancy/flux"
    tenants_dir: "{{ playbook_dir }}/../environments/{{ tenant_env }}/tenants"
    tenant_defaults_file: "{{ playbook_dir }}/../environments/{{ tenant_env }}/tenant-defaults.yaml"
    vm_defaults_file: "{{ playbook_dir }}/../environments/{{ tenant_env }}/vm-defaults.yaml"

# --- Flux (minimal: only what the tenant pattern needs) --------------------------------------------
# source-controller serves the OCIRepository/HelmChart; helm-controller renders HelmReleases. No
# kustomize/notification controllers — the orchestrator applies HelmReleases directly to the API.
- name: Install Flux controllers (source-controller + helm-controller)
  ansible.builtin.command: >
    flux install --components=source-controller,helm-controller --namespace=flux-system
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: true

# Nested-node workaround (lab-notes #36): on the Talos-in-Podman lab the kubelet's host->pod probe to the
# Flux controllers times out (Cilium eBPF on the nested node) and the default httpGet liveness probe
# crash-loops them — even though the controllers are healthy and pod->pod (chart fetch) works fine. The
# images are distroless (no shell, so no exec-probe alternative), so remove the probes. `flux install`
# re-adds them each run, so this runs every time; real nodes never need it. Without this the wait below
# hangs forever. See docs/development/lab-notes.md.
- name: "Nested-node: remove the Flux controllers' host->pod probes (they crash-loop otherwise)"
  ansible.builtin.command: >
    kubectl -n flux-system patch deploy {{ item }} --type=json
    -p=[{"op":"remove","path":"/spec/template/spec/containers/0/livenessProbe"},{"op":"remove","path":"/spec/template/spec/containers/0/readinessProbe"}]
  loop: [source-controller, helm-controller]
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  register: flux_probe_patch
  changed_when: '"patched" in flux_probe_patch.stdout'
  failed_when: flux_probe_patch.rc != 0 and 'does not exist' not in flux_probe_patch.stderr

- name: Wait for the Flux controllers to be Available
  ansible.builtin.command: >
    kubectl -n flux-system wait --for=condition=Available
    deploy/source-controller deploy/helm-controller --timeout=180s
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: false

# --- control plane: registry + OCIRepository source ------------------------------------------------
- name: Apply the tenant control plane (chart registry + OCIRepository)
  ansible.builtin.command: "kubectl apply -k {{ flux_dir }}"
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: true

# route-sync is no longer part of that kustomization: the physical lab serves routes as Ingress objects
# and must not have the CronJob re-created (adr-pomerium-ingress.md §6). The VM lab has not migrated,
# so it still needs the renderer and applies it explicitly here.
- name: "VM lab only: the route-sync CronJob (not yet migrated to Ingress routing)"
  ansible.builtin.command: "kubectl apply -f {{ flux_dir }}/route-sync.yaml"
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: true

- name: Wait for the chart registry to be Ready
  ansible.builtin.command: "kubectl -n flux-system rollout status deploy/registry --timeout=120s"
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: false

# --- publish the chart, then pull it -----------------------------------------------------------------
- name: (Re)publish the talu-tenant + talu-vm charts to the in-cluster registry
  ansible.builtin.shell: |
    set -e
    kubectl -n flux-system delete job chart-publish --ignore-not-found
    kubectl apply -f {{ flux_dir }}/chart-publish-job.yaml
    kubectl -n flux-system wait --for=condition=complete job/chart-publish --timeout=240s
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: true

- name: Reconcile the OCIRepositories so they pull the freshly-published charts
  ansible.builtin.command: "flux reconcile source oci {{ item }} --namespace flux-system"
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  loop: [talu-tenant, talu-vm]
  changed_when: true

# --- tenants: management namespace + mirrored CA + a HelmRelease per tenant file ---------------------
- name: Ensure the tenants management namespace exists
  ansible.builtin.shell: |
    kubectl create namespace {{ tenant_release_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: true

# valuesFrom reads the CA from a ConfigMap in the HelmRelease's namespace — mirror it (value only, so
# there's no stale metadata) so it's never duplicated into tenant values. Re-runs keep it fresh.
- name: Mirror the Pomerium User CA ConfigMap into the tenants namespace
  ansible.builtin.shell: |
    CA=$(kubectl -n pomerium get cm pomerium-user-ca -o jsonpath='{.data.user_ca\.pub}')
    kubectl -n {{ tenant_release_namespace }} create configmap pomerium-user-ca \
      --from-literal=user_ca.pub="$CA" --dry-run=client -o yaml | kubectl apply -f -
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: true

# The operator half of the contract (x-talu-owner: operator) lives once per site, not once per tenant.
# TWO files since the chart split (adr-api-layer.md §10.1): both schemas are additionalProperties:false,
# so a VM-side key merged into a tenant release would be rejected. Flux merges them BEFORE spec.values,
# so a tenant/VM file still wins where it overlaps.
- name: Check for site-level operator defaults
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ tenant_defaults_file }}"
    - "{{ vm_defaults_file }}"
  register: defaults_stat

- name: Render the site's operator defaults into ConfigMaps
  ansible.builtin.shell: |
    kubectl -n {{ tenant_release_namespace }} create configmap {{ item.cm }} \
      --from-file=values.yaml={{ item.file }} --dry-run=client -o yaml | kubectl apply -f -
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  loop:
    - { cm: talu-tenant-defaults, file: "{{ tenant_defaults_file }}" }
    - { cm: talu-vm-defaults, file: "{{ vm_defaults_file }}" }
  when: (defaults_stat.results | selectattr('item', 'equalto', item.file) | map(attribute='stat.exists') | first | default(false))
  changed_when: true

# The VM size vocabulary (VirtualMachineClusterInstancetype). Cluster-scoped and applied BEFORE any
# VM: a VM referencing an absent instancetype is rejected at admission.
- name: Apply the VM size catalog
  ansible.builtin.command: "kubectl apply -k {{ playbook_dir }}/../components/tenancy/sizes"
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: true

# Layout since the split: tenants/<slug>/tenant.yaml + tenants/<slug>/vms/<name>.yaml.
#
# Discovery is delegated to the CONTROL NODE on purpose. `find` is a module, so it runs on the target
# by default and would return gateway paths — but the values are read with lookup('file'), which is
# always control-node-side, so those paths cannot be opened. Both sides must agree; globbing the repo
# source is the side that has the files. (`fileglob` is not an option: it globs only the FINAL path
# component, so tenants/*/tenant.yaml collapses to tenants/*.) Only the rendered HelmRelease is
# written to the gateway.
- name: Discover tenant definitions
  ansible.builtin.find:
    paths: "{{ tenants_dir }}"
    patterns: "tenant.yaml"
    recurse: true
  delegate_to: localhost
  run_once: true
  register: tenant_files

- name: Discover VM definitions
  ansible.builtin.find:
    paths: "{{ tenants_dir }}"
    patterns: "*.yaml"
    recurse: true
  delegate_to: localhost
  run_once: true
  register: all_yaml

# Rebuilt from scratch each run, NOT just created. The role applies the whole directory, so a
# rendered HelmRelease left behind by a previous run would be re-applied for ever — deleting a tenant
# (or a VM) from the repo would silently resurrect it on the next run.
#
# NOTE this makes the run converge on what the repo says should EXIST; it still does not delete the
# HelmRelease of a tenant removed from the repo. Removing a tenant from Git does not yet remove it
# from the cluster — that needs a prune step keyed on the talu.io/tenant label.
- name: Reset the HelmRelease render directory
  ansible.builtin.file:
    path: "/tmp/talu-hr"
    state: "{{ item }}"
    mode: "0755"
  loop: [absent, directory]

- name: Render a HelmRelease per tenant
  ansible.builtin.template:
    src: tenant-helmrelease.yaml.j2
    dest: "/tmp/talu-hr/{{ item.path | dirname | basename }}.yaml"
    mode: "0644"
  vars:
    tenant_name: "{{ item.path | dirname | basename }}"
    tenant_values: "{{ lookup('file', item.path) }}"
  loop: "{{ tenant_files.files }}"

- name: Render a HelmRelease per VM
  ansible.builtin.template:
    src: vm-helmrelease.yaml.j2
    dest: "/tmp/talu-hr/{{ item.path | dirname | dirname | basename }}-{{ item.path | basename | splitext | first }}.yaml"
    mode: "0644"
  vars:
    tenant_name: "{{ item.path | dirname | dirname | basename }}"
    vm_name: "{{ item.path | basename | splitext | first }}"
    vm_values: "{{ lookup('file', item.path) }}"
    tenant_data: "{{ lookup('file', item.path | dirname | dirname + '/tenant.yaml') | from_yaml }}"
  loop: "{{ all_yaml.files | selectattr('path', 'search', '/vms/') | list }}"

- name: Apply the tenant + VM HelmReleases (Flux renders each into the tenant namespace)
  ansible.builtin.command: "kubectl apply -f /tmp/talu-hr/"
  environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
  changed_when: true
