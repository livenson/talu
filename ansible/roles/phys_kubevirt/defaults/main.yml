---
# KubeVirt + CDI on the physical cluster. Real hardware → useEmulation:false (VMs run on genuine
# nested KVM, not TCG) and real live migration between hosts (the thing the VM lab can't do).
kubevirt_kubeconfig: "{{ talos_gen_dir }}/kubeconfig"
kubevirt_k: "kubectl --kubeconfig={{ talos_gen_dir }}/kubeconfig"

kubevirt_version: "v1.8.4"          # latest; KubeVirt v1.8 targets k8s <=1.35 (we run 1.35.7)
cdi_version: "v1.65.0"              # latest CDI

kubevirt_use_emulation: false      # nested /dev/kvm present → real KVM
# Live migration (real here). RWX-block RBD is the migratable VM-disk path.
kubevirt_parallel_migrations: 5
kubevirt_parallel_outbound_migrations: 2

# CDI scratch: a plain RWO ceph-block PVC is fine (temporary import space).
cdi_scratch_storageclass: ceph-block
kubevirt_vm_storageclass: ceph-block     # RBD; VM disks use volumeMode:Block, RWX for migration

# virtctl on the gateway (for console + migrate).
virtctl_url: "https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/virtctl-{{ kubevirt_version }}-linux-amd64"
