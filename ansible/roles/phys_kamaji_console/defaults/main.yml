---
# Kamaji Console — the web UI for tenant control planes (the KaaS analog of kubevirt-manager's
# vms.<domain>). Management-side: it lists ALL TenantControlPlanes (name/namespace/status/endpoint/
# version/datastore), so it is ADMIN-ONLY and fronted by Pomerium at clusters.<domain>. It also has
# its own NextAuth email/password login (Pomerium is the outer gate; the console login is inner).
kc_k: "kubectl --kubeconfig={{ talos_gen_dir }}/kubeconfig"
kc_kubeconfig: "{{ talos_gen_dir }}/kubeconfig"
kc_dir: "{{ talos_gen_dir }}/kamaji-console"

kamaji_console_chart_version: "0.1.3"   # app v0.2.1 (clastix.github.io/charts)
kamaji_console_namespace: kamaji-system
# Inner (console) login. Pomerium already restricts WHO reaches the page to this same admin.
kamaji_console_admin_email: "{{ dex_user_email }}"
# Password + JWT secret are generated on the gateway and stored in the kamaji-console Secret if absent
# (idempotent — a re-run does not rotate them).
