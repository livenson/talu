---
# Tetragon — eBPF runtime security (process/file/network + in-kernel enforcement). REAL HARDWARE
# ONLY: needs kernel BTF + /sys/kernel/tracing, which the nested VM lab lacks but these hosts have
# (verified in Phase 0). Wired into environments/example; enabled here for the first time on real HW.
tetra_kubeconfig: "{{ talos_gen_dir }}/kubeconfig"
tetra_k: "kubectl --kubeconfig={{ talos_gen_dir }}/kubeconfig"
tetra_helm: /usr/local/bin/helm
tetra_dir: "{{ playbook_dir }}/../components/infrastructure/tetragon"
tetra_namespace: tetragon
tetragon_version: "1.7.0"          # latest tetragon chart (helm.cilium.io)
tetra_chart_tgz: "{{ talos_gen_dir }}/tetragon-{{ tetragon_version }}.tgz"
