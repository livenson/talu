---
# Two stages, each independently taggable so the VMs can be validated in maintenance mode before
# any config is applied:
#   --tags vm-create       → download image, create disks, virt-install (per host)
#   --tags talos-bootstrap → gen config, apply-config, bootstrap etcd, fetch kubeconfig (gateway)
- name: Create the Talos VMs on this host
  ansible.builtin.include_tasks:
    file: vm-create.yml
    apply: { tags: [vm-create] }
  tags: [vm-create]

- name: Bootstrap the Talos cluster (gateway, run once)
  ansible.builtin.include_tasks:
    file: bootstrap.yml
    apply: { tags: [talos-bootstrap] }
  tags: [talos-bootstrap]
