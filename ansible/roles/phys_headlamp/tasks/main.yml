---
- name: Ensure work dir
  ansible.builtin.file: { path: "{{ hl_dir }}", state: directory, mode: "0755" }

- name: Pull the Headlamp chart (WAN retries)
  ansible.builtin.shell: |
    helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/ >/dev/null 2>&1 || true
    helm repo update headlamp >/dev/null
    for i in 1 2 3 4 5; do
      helm pull headlamp/headlamp --version {{ headlamp_chart_version }} -d {{ hl_dir }} && exit 0
      sleep 5
    done
    exit 1
  args: { creates: "{{ hl_dir }}/headlamp-{{ headlamp_chart_version }}.tgz" }

# ── cluster-sync: keeps Headlamp's kubeconfig in step with the provisioned tenants ─────────────
- name: Deploy the cluster-sync reconciler (RBAC + script + CronJob)
  ansible.builtin.copy: { src: cluster-sync.yaml, dest: "{{ hl_dir }}/cluster-sync.yaml", mode: "0644" }

- name: Apply cluster-sync
  ansible.builtin.command: "{{ hl_k }} apply -f {{ hl_dir }}/cluster-sync.yaml"
  changed_when: true

# Seed an empty kubeconfig so Headlamp can mount it on first start (the reconciler populates it next).
- name: Seed the headlamp-kubeconfig Secret if absent
  ansible.builtin.shell: |
    if {{ hl_k }} -n {{ headlamp_namespace }} get secret headlamp-kubeconfig >/dev/null 2>&1; then
      echo exists
    else
      printf 'apiVersion: v1\nkind: Config\nclusters: []\nusers: []\ncontexts: []\ncurrent-context: ""\n' > {{ hl_dir }}/empty.kubeconfig
      {{ hl_k }} -n {{ headlamp_namespace }} create secret generic headlamp-kubeconfig --from-file=config={{ hl_dir }}/empty.kubeconfig
      echo seeded
    fi
  register: hl_seed
  changed_when: "'seeded' in hl_seed.stdout"

# ── Headlamp: MULTI-CLUSTER over the tenant clusters (not the management substrate) ────────────
# inCluster=false so the console does NOT show the Talu management cluster; -kubeconfig loads the
# tenant clusters (client-cert creds, so no login) from the reconciler-maintained Secret.
- name: Render Headlamp values
  ansible.builtin.copy:
    dest: "{{ hl_dir }}/values.yaml"
    mode: "0644"
    content: |
      config:
        inCluster: false
        baseURL: ""
        extraArgs:
          - "-kubeconfig=/kube/config"
      serviceAccount: { create: true }
      clusterRoleBinding: { create: false }
      service: { type: ClusterIP }
      volumes:
        - name: tenant-kubeconfig
          secret: { secretName: headlamp-kubeconfig }
      volumeMounts:
        - name: tenant-kubeconfig
          mountPath: /kube
          readOnly: true

- name: Install/upgrade Headlamp
  ansible.builtin.command: >
    helm upgrade --install headlamp {{ hl_dir }}/headlamp-{{ headlamp_chart_version }}.tgz
    -n {{ headlamp_namespace }} -f {{ hl_dir }}/values.yaml --wait --timeout 6m
  environment: { KUBECONFIG: "{{ hl_kubeconfig }}" }
  changed_when: true

- name: Wait for the Headlamp rollout
  ansible.builtin.command: "{{ hl_k }} -n {{ headlamp_namespace }} rollout status deploy/headlamp --timeout=180s"
  changed_when: false

# Run the reconciler once now so the tenant clusters show immediately (the CronJob keeps it in sync).
- name: Reconcile the tenant cluster list once
  ansible.builtin.shell: |
    {{ hl_k }} -n {{ headlamp_namespace }} delete job headlamp-cluster-sync-init --ignore-not-found >/dev/null 2>&1
    {{ hl_k }} -n {{ headlamp_namespace }} create job headlamp-cluster-sync-init --from=cronjob/headlamp-cluster-sync
    {{ hl_k }} -n {{ headlamp_namespace }} wait --for=condition=complete job/headlamp-cluster-sync-init --timeout=150s
    {{ hl_k }} -n {{ headlamp_namespace }} logs job/headlamp-cluster-sync-init | tail -1
  register: hl_sync
  changed_when: true

- ansible.builtin.debug:
    msg: >-
      Headlamp at https://clusters.{{ lab_domain }} — single Pomerium/Dex SSO, shows the provisioned
      tenant clusters (cluster-sync reconciles new/removed tenants every 2 min). {{ hl_sync.stdout }}

# ── Pomerium route as an Ingress (adr-pomerium-ingress.md §3b) ────────────────────────────────────
# Headlamp, the tenant-cluster console. Replaces the route add-headlamp-route.py patches
# into the live blob today (§7.6) — that patcher goes at step 6.
# Inert until the Ingress Controller is serving; the route-sync path is unchanged meanwhile.
- name: Pomerium route — clusters (Ingress)
  ansible.builtin.include_role:
    name: phys_pomerium_route
  vars:
    pr_name: pomerium-route-clusters
    pr_namespace: kamaji-system
    pr_host: "clusters.{{ lab_domain }}"
    pr_service: headlamp
    pr_port: 80
    pr_websockets: true
  tags: [pomerium-routes]
