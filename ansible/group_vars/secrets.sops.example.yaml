# EXAMPLE — the ansible secret vars that must NOT be committed plaintext. For a real deployment:
#   1. cp secrets.sops.example.yaml secrets.sops.yaml
#   2. fill REAL, freshly-generated values (the demo values in all.yml/phys.yml are burned)
#   3. sops -e -i secrets.sops.yaml           # .sops.yaml encrypts ansible/**/*.sops.yaml whole
#   4. load it: community.sops vars plugin, or `-e @<(sops -d secrets.sops.yaml)`
# See docs/operations/secrets.md § Migration. This file (the *.example) is safe to commit; the
# filled-in secrets.sops.yaml is git-ignored via *.secret.yaml / secrets.yaml patterns + encryption.
---
# OIDC client secret shared by Dex and Pomerium.  generate: openssl rand -hex 32
pomerium_idp_client_secret: "REPLACE-ME-openssl-rand-hex-32"
# bcrypt of the demo/login password.  generate: htpasswd -nbBC 10 x <pw> | cut -d: -f2 | sed 's/^$2y/$2a/'
dex_user_bcrypt: "REPLACE-ME-bcrypt-hash"
