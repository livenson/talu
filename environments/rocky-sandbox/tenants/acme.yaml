# Tenant "acme" — a values-PR reconciled by Flux via the talu-tenant chart.
# Creating a tenant or adding a VM is an edit to a file like this; nothing structural changes.
#
# CONSUMER-OWNED FIELDS ONLY (x-talu-owner: consumer in the chart schema). The operator half — image
# coordinates, the Pomerium User CA, component pins — lives once per site in ../tenant-defaults.yaml
# and is merged ahead of this file. See docs/architecture/adr-api-layer.md §4.
projectUuid: "aaaaaaaa-1111-2222-3333-444444444444"
slug: acme
allowedUsers: [alice@talu.local]

# Simplest tenant: it inherits the site's ephemeral containerDisk image and states only its own sizing.
# For persistent, auto-patching, bootc-self-updating disks + per-tenant dashboards, see beta.yaml.
defaults:
  memory: 1536Mi
  principal: talu

vms:
  app1:
    principal: alice
    guestSecrets: |
      DB_PASSWORD=acme-db-secret
      TENANT=acme

resourceQuota:
  requests.memory: 8Gi
  requests.cpu: "4"
  persistentvolumeclaims: "10"
