# Tenant "acme" on the physical lab — a values file Flux renders (via the talu-tenant chart) into a
# namespace + VMs. Creating a tenant or adding a VM is an edit to a file like this; nothing structural.
projectUuid: "aaaaaaaa-1111-2222-3333-444444444444"
slug: acme
allowedUsers: [alice@talu.local]

# Pomerium User CA the VMs trust — injected at reconcile time via valuesFrom (empty here; Native SSH
# CA is deferred on this lab, so VMs boot without Pomerium SSH trust — the tenant API still validates).
sshUserCaPubKey: ""

defaults:
  image: quay.io/containerdisks/ubuntu:24.04   # ephemeral containerDisk (real KVM here)
  memory: 1536Mi
  principal: talu

vms:
  app1:
    principal: alice
    guestSecrets: |
      DB_PASSWORD=acme-db-secret
      TENANT=acme

resourceQuota:
  requests.memory: 8Gi
  requests.cpu: "4"
  persistentvolumeclaims: "10"
