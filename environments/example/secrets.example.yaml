# copy to secrets.yaml and encrypt with SOPS/age — NEVER commit real secrets
#   cp secrets.example.yaml secrets.yaml && $EDITOR secrets.yaml && sops -e -i secrets.yaml
# Apply via the Flux decryption Kustomization or `sops -d secrets.yaml | kubectl apply -f -` —
# NOT through kustomize (it does not decrypt). Full model: docs/operations/secrets.md.
---
# OIDC client secret shared by Dex and Pomerium (openssl rand -hex 32).
apiVersion: v1
kind: Secret
metadata:
  name: pomerium-idp
  namespace: pomerium
type: Opaque
stringData:
  idp-client-secret: "REPLACE-ME-openssl-rand-hex-32"
---
# Garage S3 credentials for Velero + the KaaS etcd-snapshot DR job (see components/platform/backup,
# components/tenancy/kaas-backup). AWS shared-credentials "cloud" file format.
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  namespace: velero
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id=REPLACE-ME
    aws_secret_access_key=REPLACE-ME
